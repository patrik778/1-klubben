<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Söderköpingsexperten – 1%-klubben</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1425;color:#f8fafc;font-family:Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:22px}main{width:min(680px,100%);background:#1b293d;border:1px solid #34465f;border-radius:25px;padding:clamp(22px,5vw,40px);box-shadow:0 20px 60px #0004}.top{display:flex;justify-content:space-between;align-items:center;gap:12px}.pill{background:#30445f;border-radius:50px;padding:9px 13px;font-size:14px}h1{font-size:clamp(30px,6vw,42px);margin:12px 0}p{color:#c7d1df;line-height:1.55}.bar{height:11px;background:#35465e;border-radius:10px;overflow:hidden;margin:26px 0}.fill{height:100%;background:#60a5fa;width:0%;transition:width .3s}.meta{display:flex;justify-content:space-between;color:#cbd5e1;margin-bottom:20px}h2{font-size:clamp(21px,4vw,27px);line-height:1.35}.option{display:block;width:100%;text-align:left;background:#283a53;border:1px solid #405571;color:white;padding:17px 18px;border-radius:15px;margin:12px 0;font:inherit;font-size:17px;line-height:1.4;cursor:pointer}.option:not(:disabled):hover{background:#365071}.option:disabled{cursor:default;opacity:.8}.option.correct{background:#145b45;border-color:#4ade80;opacity:1}.option.wrong{background:#6b2734;border-color:#fb7185;opacity:1}.feedback{padding:14px 17px;border-radius:12px;background:#26364c;line-height:1.55;margin:18px 0}.next{background:#2563eb;color:#fff;border:0;border-radius:13px;padding:16px 20px;font-weight:700;font-size:17px;width:100%;cursor:pointer;margin-top:12px}.small{font-size:13px;color:#aebdd0;text-align:center;margin-top:24px}a{color:#93c5fd}#end{text-align:center}#end h2{font-size:34px}#end strong{font-size:52px;color:#93c5fd}</style></head><body><main><div class="top"><span class="pill">🏆 1%-klubben</span><span class="pill" id="count">Fråga 1 av 15</span></div><h1>🏰 Söderköpingsexperten</h1><p>15 riktigt svåra frågor om Söderköpings historia och kultur. Ett svar per fråga.</p><div class="bar"><div class="fill" id="fill"></div></div><div id="game"><div class="meta"><span id="category">Historia</span><b id="score">Poäng: 0</b></div><h2 id="question"></h2><div id="options"></div><div id="feedback" class="feedback" hidden></div><button id="next" class="next" hidden>Nästa fråga →</button></div><div id="end" hidden></div><div class="small">Söderköpingsexperten • Ett fristående spel i 1%-klubben</div></main><script>
const questions=[
{c:'Medeltid',q:'Vilket år nämns Söderköping för första gången i ett bevarat skriftligt dokument?',o:['1235','1250','1270','1302'],a:1,e:'År 1250 testamenterade drottning Katarina Sunesdotter Söderköping till sin syster Benedicta.'},
{c:'Klosterhistoria',q:'Vilken orden anlade ett kloster i Söderköping år 1235?',o:['Dominikanorden','Cisterciensorden','Franciskanorden','Birgittinorden'],a:2,e:'Franciskanerna, även kallade gråbröder, anlade sitt kloster här 1235.'},
{c:'Kunglig historia',q:'Vilken kung kröntes år 1302 i S:t Laurentii kyrka?',o:['Magnus Ladulås','Birger Magnusson','Magnus Eriksson','Erik av Pommern'],a:1,e:'Birger Magnusson och hans hustru Märta kröntes i S:t Laurentii kyrka 1302.'},
{c:'Rikshistoria',q:'Vilket år ägde mötet i Söderköping rum som ibland kallas Sveriges första riksdag?',o:['1281','1302','1359','1389'],a:2,e:'År 1359 valdes Magnus Eriksson åter till kung i Söderköping; mötet har kallats Sveriges första riksdag.'},
{c:'Nordisk historia',q:'Vilken regent insattes i Söderköping år 1389 som härskare över Norden?',o:['Drottning Margareta','Drottning Kristina','Drottning Helvig','Drottning Katarina'],a:0,e:'Drottning Margareta insattes här 1389 som regent för Norden.'},
{c:'Kyrkohistoria',q:'Vilken medeltida kyrka låg där Söderköpings kanalhamn finns i dag?',o:['Drothems kyrka','S:t Laurentii kyrka','S:t Ilians kyrka','Skönberga kyrka'],a:2,e:'S:t Ilians kyrka låg vid dagens kanalhamn; rester av kyrkan och kyrkogården påverkades av kanalbygget.'},
{c:'Göta kanal',q:'Vilken kung deltog vid Göta kanals invigning i Söderköping och Mem 1832?',o:['Gustav IV Adolf','Karl XIV Johan','Oscar II','Karl XV'],a:1,e:'Karl XIV Johan deltog vid invigningen av hela Göta kanal 1832.'},
{c:'Stadens geografi',q:'Vilken stadsdel påverkades särskilt när Göta kanal grävdes genom Söderköping?',o:['Drothemskvarteren','Bergskvarteret','Skönberga','Bossgård'],a:1,e:'En stor del av Bergskvarteret grävdes bort och ett trettiotal bostadshus fick flyttas eller rivas.'},
{c:'Kanalteknik',q:'Vilket år byggdes den sluss i centrala Söderköping som används i dag?',o:['1810','1832','1847','1869'],a:2,e:'Den nuvarande slussen byggdes 1847 eftersom den ursprungliga slussen från 1832 började sjunka.'},
{c:'Kanalhistoria',q:'Vilket kanalångfartyg körde in i Söderköpings slussportar den 3 juni 1931?',o:['Wilhelm Tham','Diana','Juno','Baltzar von Platen'],a:2,e:'Kanalångaren Juno körde in i slussportarna 1931 efter ett missförstånd i maskinmanövreringen.'},
{c:'Stadsplanering',q:'Vilken av följande gator var INTE en av de tre huvudgator som utgick från medeltidens Rådhustorg?',o:['Storgatan','Vintervadsgatan','Hamngatan','Drothemsgatan'],a:3,e:'De tre huvudgatorna var Storgatan, Vintervadsgatan och Hamngatan.'},
{c:'Medeltida handel',q:'Vilken naturförändring bidrog till att Söderköping förlorade sin roll som viktig hamnstad?',o:['Landhöjningen','Vulkanisk aktivitet','Stigande havsnivå','Ökenspridning'],a:0,e:'Landhöjningen gjorde hamnen svårare att använda för större handelsfartyg.'},
{c:'Medeltida möten',q:'Vilket framtida svenskt universitet diskuterades vid ett kyrkomöte i Söderköping 1441?',o:['Lunds universitet','Uppsala universitet','Linköpings universitet','Stockholms universitet'],a:1,e:'Vid kyrkomötet 1441 fattades enligt Söderköpings kommuns historieskrivning beslut om att bilda Uppsala universitet.'},
{c:'Kanalens historia',q:'Vilket årtal förknippas med byggstarten för Göta kanal?',o:['1788','1800','1810','1822'],a:2,e:'Göta kanal byggdes mellan 1810 och 1832.'},
{c:'Söderköpings kultur',q:'Vilket år började det årliga medeltidsevenemanget Söderköpings Gästabud?',o:['1998','2002','2006','2013'],a:2,e:'Söderköpings Gästabud har arrangerats årligen sedan 2006.'}
];
let i=0,points=0,locked=false;const $=id=>document.getElementById(id);function render(){locked=false;const q=questions[i];$('count').textContent=`Fråga ${i+1} av ${questions.length}`;$('fill').style.width=`${i/questions.length*100}%`;$('category').textContent=q.c;$('score').textContent=`Poäng: ${points}`;$('question').textContent=q.q;$('feedback').hidden=true;$('next').hidden=true;$('options').innerHTML='';q.o.forEach((v,j)=>{const b=document.createElement('button');b.className='option';b.textContent=`${'ABCD'[j]}. ${v}`;b.onclick=()=>answer(j);$('options').appendChild(b)})}function answer(j){if(locked)return;locked=true;const q=questions[i];if(j===q.a)points++;[...$('options').children].forEach((b,k)=>{b.disabled=true;if(k===q.a)b.classList.add('correct');else if(k===j)b.classList.add('wrong')});$('score').textContent=`Poäng: ${points}`;$('feedback').hidden=false;$('feedback').textContent=(j===q.a?'✅ Rätt! ':'❌ Fel. Rätt svar: '+ 'ABCD'[q.a]+'. '+q.o[q.a]+'. ')+q.e;$('next').hidden=false;$('next').textContent=i===questions.length-1?'Visa slutresultat 🏆':'Nästa fråga →'}$('next').onclick=()=>{i++;if(i<questions.length)render();else finish()};function finish(){$('fill').style.width='100%';$('count').textContent='Klart!';$('game').hidden=true;$('end').hidden=false;const pct=Math.round(points/questions.length*100);$('end').innerHTML=`<h2>🏆 Slutresultat</h2><strong>${points} av ${questions.length}</strong><p>${pct}% rätt</p><p>${points>=13?'Du är en riktig Söderköpingsexpert!':points>=9?'Mycket bra koll på Söderköping!':points>=5?'Bra kämpat – det här var svåra frågor!':'Söderköping har många spännande hemligheter att upptäcka!'}</p><button class="next" id="share">📋 Kopiera resultatet</button><button class="next" id="restart">Spela igen</button><p style="font-size:13px">Faktaunderlag: Söderköpings kommun och Göta kanal.</p>`;$('restart').onclick=()=>{i=0;points=0;$('game').hidden=false;$('end').hidden=true;render()};$('share').onclick=async()=>{const s=`🏰 Söderköpingsexperten – Jag fick ${points} av 15 rätt! Vågar du utmana mig? ${location.href}`;try{await navigator.clipboard.writeText(s);$('share').textContent='✅ Resultatet kopierat'}catch(e){prompt('Kopiera resultatet:',s)}}}render();
</script></body></html>

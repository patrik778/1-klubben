<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hjärnmatchen – IQ 120 – 50 frågor</title><style>*{box-sizing:border-box}body{margin:0;background:#101326;color:#fff;font:18px Arial,sans-serif}main{max-width:650px;margin:0 auto;padding:25px 18px 60px}h1{text-align:center;font-size:29px}p{line-height:1.55}.sub{color:#aeb9d5;text-align:center}.card{background:#1c2541;border-radius:20px;padding:23px;margin-top:24px;box-shadow:0 8px 30px #0004}.bar{height:11px;background:#394462;border-radius:20px;overflow:hidden;margin:15px 0}.fill{height:100%;background:#3c82f6;width:0}.option,button{display:block;width:100%;border:0;border-radius:13px;padding:17px 15px;margin:12px 0;background:#2862e8;color:white;font-size:18px;font-weight:700;cursor:pointer;text-align:left}.option:disabled{opacity:.7;cursor:default}.option.good{background:#13875c;opacity:1}.option.bad{background:#b43d4c;opacity:1}.next{background:#8541e8;text-align:center}.muted{color:#b7c4df}.hidden{display:none}.result{text-align:center;font-size:24px}.share{background:#1d916c;text-align:center}.back{color:#d0dcff;text-decoration:none;display:block;text-align:center;margin-top:20px}.small{font-size:14px;color:#aab8d4}#explanation{background:#273456;border-radius:10px;padding:13px;margin-top:12px}</style></head><body><main><h1>🧠 Hjärnmatchen – IQ 120</h1><p class="sub">50 nya, svåra frågor · Logik, ord och mönster</p><div id="game" class="card"><div id="counter" class="muted"></div><div class="bar"><div id="fill" class="fill"></div></div><h2 id="question"></h2><div id="options"></div><div id="explanation" class="hidden"></div><button id="next" class="next hidden" onclick="nextQuestion()">Nästa fråga →</button></div><div id="end" class="card hidden"><h2 class="result">🏆 Ditt resultat</h2><p id="score" class="result"></p><p id="rating" class="sub"></p><button class="share" onclick="shareResult()">📤 Dela resultat</button><button class="next" onclick="restart()">🔄 Spela igen</button></div><a class="back" href="index.html">← Till alla spel</a><p class="small">IQ 120 beskriver svårighetsnivån i detta underhållningsquiz och är inte ett standardiserat IQ-test.</p></main><script>const questions=[{"q": "Vilket ord passar inte in?", "a": ["Eko", "Spegelbild", "Skugga", "Reflex"], "correct": 2, "why": "De andra är återgivningar av ljus eller ljud; en skugga är frånvaro av ljus."}, {"q": "Alla glim är nor. Ingen nor är vek. Vad måste gälla?", "a": ["Ingen glim är vek", "Alla vek är glim", "Några nor är vek", "Alla nor är glim"], "correct": 0, "why": "Om alla glim är nor och ingen nor är vek kan ingen glim vara vek."}, {"q": "Vilken bokstav följer? A, C, F, J, O, ?", "a": ["T", "U", "V", "W"], "correct": 1, "why": "Stegen ökar med 1: +2, +3, +4, +5, +6."}, {"q": "En man tittar på ett foto och säger: ”Jag har inga syskon, men mannens far är min fars son.” Vem är på fotot?", "a": ["Hans far", "Hans son", "Han själv", "Hans farfar"], "correct": 1, "why": "Min fars son är mannen själv, så fotot visar hans son."}, {"q": "Vilket ord blir ett annat vanligt svenskt ord om första och sista bokstaven byter plats?", "a": ["KRAM", "SALT", "RING", "BORD"], "correct": 0, "why": "KRAM blir MARK."}, {"q": "Om igår var dagen före torsdag, vilken dag är det i övermorgon?", "a": ["Fredag", "Lördag", "Söndag", "Måndag"], "correct": 1, "why": "Igår var onsdag, idag torsdag, övermorgon lördag."}, {"q": "Vad kommer härnäst? ▲ ● ● ▲ ● ● ▲ ?", "a": ["▲", "●", "■", "◆"], "correct": 1, "why": "Mönstret upprepar en triangel följd av två cirklar."}, {"q": "Fem personer står i kö. Ada står före Bo, Bo före Cia, och Dan efter Cia. Vem måste stå före Dan?", "a": ["Eli", "Ada", "Ingen", "Bara Cia"], "correct": 1, "why": "Ada står före Bo, som står före Cia, som står före Dan."}, {"q": "Vilket par har samma relation som ”bok : kapitel”?", "a": ["Träd : skog", "Hus : rum", "Båt : hav", "Penna : papper"], "correct": 1, "why": "Ett rum är del av ett hus, liksom ett kapitel av en bok."}, {"q": "En klocka visar 03.15. Vad är vinkeln mellan visarna, ungefär?", "a": ["0°", "7,5°", "30°", "90°"], "correct": 1, "why": "Timvisaren har rört sig 7,5° efter tre."}, {"q": "Vilket påstående är logiskt likvärdigt med ”Om det regnar blir marken våt”?", "a": ["Om marken är våt regnar det", "Om marken inte är våt regnar det inte", "Om det inte regnar är marken torr", "Marken är alltid våt"], "correct": 1, "why": "Kontrapositionen är logiskt likvärdig."}, {"q": "Vilket ord har en annan typ av betydelse än de andra?", "a": ["Viskning", "Rop", "Skratt", "Lyssning"], "correct": 3, "why": "De tre första är ljud som uttrycks; lyssning tar emot ljud."}, {"q": "En låda har tre röda och två blå kulor. Du tar utan att titta. Hur många måste du ta för att säkert få två av samma färg?", "a": ["2", "3", "4", "5"], "correct": 1, "why": "Med tre kulor måste minst två ha samma färg."}, {"q": "Vilken bokstav saknas? Z, X, U, Q, L, ?", "a": ["G", "F", "E", "D"], "correct": 1, "why": "Stegen bakåt är 2, 3, 4, 5, 6."}, {"q": "Vilket påstående är en logisk motsägelse?", "a": ["Det regnar eller regnar inte", "Det regnar och regnar inte samtidigt på samma plats", "Om det regnar är marken kanske våt", "Ibland är det soligt"], "correct": 1, "why": "Ett påstående och dess negation kan inte båda vara sanna samtidigt i samma avseende."}, {"q": "Vilken figur ska komma efter: □ ○ △ □ ○ △ □ ?", "a": ["△", "□", "○", "◇"], "correct": 2, "why": "Sekvensen □ ○ △ upprepas."}, {"q": "Tre lådor är märkta ÄPPLEN, PÄRON och BLANDAT. Alla etiketter är fel. Vilken låda ska du dra en frukt ur först för att kunna märka alla rätt?", "a": ["ÄPPLEN", "PÄRON", "BLANDAT", "Vilken som helst"], "correct": 2, "why": "BLANDAT-lådan innehåller bara en sort eftersom etiketten är fel."}, {"q": "Vilket ord kan stå efter både ”bok” och ”väg” och bilda vanliga sammansatta ord?", "a": ["Märke", "Hylla", "Ljus", "Sida"], "correct": 0, "why": "Bokmärke och vägmärke är vanliga sammansättningar."}, {"q": "Om alla A är B och några B är C, vad kan man säkert säga?", "a": ["Några A är C", "Alla C är A", "Inga A är C", "Inget av alternativen"], "correct": 3, "why": "Överlappet mellan A och C är inte bestämt."}, {"q": "Vilket tal följer mönstret 1, 2, 4, 7, 11, ?", "a": ["14", "15", "16", "17"], "correct": 2, "why": "Skillnaderna är +1, +2, +3, +4, +5."}, {"q": "Vilken slutsats följer av ”Alla ekar är träd, och inget träd är en sten”?", "a": ["Ingen ek är en sten", "Alla stenar är ekar", "Några ekar är stenar", "Alla träd är ekar"], "correct": 0, "why": "Ekar är träd och inga träd är stenar."}, {"q": "Vilken sak är mest lik ”nyckel” i relationen ”nyckel : lås”?", "a": ["Kod : kassaskåp", "Fönster : vägg", "Dörr : hus", "Lampa : el"], "correct": 0, "why": "Båda är sätt att öppna en låst anordning."}, {"q": "En kod följer regeln att varje bokstav flyttas två steg framåt i alfabetet. Vad blir KATT?", "a": ["MCVV", "MBVV", "MCUU", "LBUU"], "correct": 0, "why": "K→M, A→C, T→V, T→V."}, {"q": "Vilket ord är en palindrom?", "a": ["Radar", "Raket", "Rabarber", "Rådjur"], "correct": 0, "why": "RADAR läses likadant bakifrån."}, {"q": "Fyra personer har varsin unik hattfärg. Om Anna inte har röd och Bo har blå, vilket är säkert?", "a": ["Anna har grön", "Bo har inte röd", "Cia har gul", "Dan har röd"], "correct": 1, "why": "Bo har blå och kan därför inte ha röd."}, {"q": "En tändsticka brinner i ett helt mörkt rum med ett stearinljus, en oljelampa och en brasa. Vad tänder du först?", "a": ["Brasan", "Oljelampan", "Stearinljuset", "Tändstickan"], "correct": 3, "why": "Du måste tända tändstickan först."}, {"q": "Vilket ord skiljer sig från de andra?", "a": ["Sekund", "Minut", "Timme", "Meter"], "correct": 3, "why": "Meter mäter längd, de andra tid."}, {"q": "Om P är längre än Q, och R är kortare än Q, vem är längst?", "a": ["P", "Q", "R", "Går inte att avgöra"], "correct": 0, "why": "P > Q > R."}, {"q": "Vilket par är motsatser på samma sätt som ”öppen : stängd”?", "a": ["Ljus : mörk", "Varm : het", "Snabb : rask", "Tung : massiv"], "correct": 0, "why": "Ljus och mörk är motsatser."}, {"q": "Du har två rep som vart och ett brinner upp på exakt 60 minuter, men ojämnt. Hur mäter du 45 minuter?", "a": ["Tänd ett rep i båda ändar och det andra i en; tänd sedan andra änden på det andra", "Tänd båda repen i en ände", "Tänd ett rep i båda ändar och vänta", "Det går inte"], "correct": 0, "why": "Första repet tar 30 minuter; det andra har då 30 min kvar, som blir 15 när båda ändar tänds."}, {"q": "Vilken bokstav följer? B, D, G, K, P, ?", "a": ["U", "V", "W", "X"], "correct": 1, "why": "Stegen är +2, +3, +4, +5, +6."}, {"q": "Om bara en av två skyltar talar sanning: Skylt A säger ”Skatten är i låda B”. Skylt B säger ”Skatten är inte i låda B”. Vad vet du?", "a": ["Skatten är i A", "Skatten är i B", "Inget om platsen", "Båda skyltarna ljuger"], "correct": 2, "why": "Skyltarna säger motsatser, så exakt en är sann oavsett plats."}, {"q": "Vilket ord kan bildas av bokstäverna i ”STENAR” med alla bokstäver exakt en gång?", "a": ["RASTEN", "STJÄRNA", "STARE", "STEN"], "correct": 0, "why": "RASTEN använder S, T, E, N, A, R en gång vardera."}, {"q": "Tre personer: en är alltid ärlig, en ljuger alltid, en växlar. Du vet inte vem som är vem. Vad kan du säkert avgöra av ett enda ja/nej-svar på en godtycklig fråga?", "a": ["Allas identiteter", "Den ärliges identitet", "Inte nödvändigtvis någon identitet", "Lögnarens identitet"], "correct": 2, "why": "Ett enda svar räcker inte generellt för att identifiera rollerna."}, {"q": "Vilket tal ska ersätta frågetecknet? 2, 6, 12, 20, 30, ?", "a": ["40", "42", "44", "46"], "correct": 1, "why": "Det är n(n+1): 1·2, 2·3, ..., 6·7."}, {"q": "Om en spegel vänder vänster och höger, vad händer egentligen rent geometriskt?", "a": ["Den byter upp och ned", "Den byter fram och bak", "Den roterar bilden 180°", "Den byter alla axlar"], "correct": 1, "why": "En plan spegel speglar djupaxeln, fram–bak."}, {"q": "Vilken slutsats följer? ”Ingen katt är fågel. Alla sparvar är fåglar.”", "a": ["Ingen sparv är katt", "Alla katter är sparvar", "Några katter är fåglar", "Alla fåglar är sparvar"], "correct": 0, "why": "Sparvar tillhör fåglar, som inte kan vara katter."}, {"q": "Vad är nästa element? AB, BC, CD, DE, ?", "a": ["DF", "EF", "FG", "EE"], "correct": 1, "why": "Båda bokstäverna flyttas ett steg framåt."}, {"q": "En mor är fyra gånger så gammal som sin dotter. Om 12 år är hon dubbelt så gammal. Hur gammal är dottern nu?", "a": ["4 år", "6 år", "8 år", "12 år"], "correct": 1, "why": "4x+12 = 2(x+12), alltså x=6."}, {"q": "Vilket alternativ beskriver en nödvändig förutsättning, inte en garanti, för att en växt ska fotosyntetisera?", "a": ["Tillgång till ljus", "Att den blommar", "Att den har frukt", "Att den är hög"], "correct": 0, "why": "Ljus behövs för fotosyntes men garanterar inte att den sker."}, {"q": "Om orden sorteras alfabetiskt, vilket kommer först?", "a": ["Bark", "Barn", "Bana", "Bank"], "correct": 2, "why": "Bana kommer före Bank, Bark och Barn."}, {"q": "En bro kan bära högst två personer. De har en ficklampa och tiderna 1, 2, 7 och 10 minuter. Vilken är kortaste tiden för alla att komma över?", "a": ["17 minuter", "18 minuter", "19 minuter", "20 minuter"], "correct": 0, "why": "1+2 över (2), 1 tillbaka (1), 7+10 över (10), 2 tillbaka (2), 1+2 över (2) =17."}, {"q": "Vilken bokstav kommer härnäst? M, T, O, T, F, L, ?", "a": ["S", "M", "J", "A"], "correct": 0, "why": "Första bokstäverna i veckodagarna måndag, tisdag, onsdag, torsdag, fredag, lördag, söndag."}, {"q": "Två dörrar: en säker och en farlig. Två vakter: en ljuger alltid och en talar alltid sanning. Vilken fråga till en valfri vakt hjälper dig hitta den säkra dörren?", "a": ["Är du ärlig?", "Vilken dörr skulle den andre säga är säker?", "Är detta en dörr?", "Vad heter du?"], "correct": 1, "why": "Båda pekar då på den farliga dörren. Välj den andra."}, {"q": "Vilket ord har samma relation till ”författare” som ”målning” har till ”konstnär”?", "a": ["Bok", "Pensel", "Förlag", "Bibliotek"], "correct": 0, "why": "En konstnär skapar en målning; en författare skapar en bok."}, {"q": "Ett påstående är: ”Alla som klarade provet tränade.” Vilket motexempel skulle göra påståendet falskt?", "a": ["Någon tränade men klarade inte provet", "Någon klarade provet utan att träna", "Ingen tränade", "Alla tränade"], "correct": 1, "why": "En person som klarade provet utan träning motbevisar det."}, {"q": "Vilken sekvens följer regeln ”växla form och öka antalet punkter”?", "a": ["●, ▲▲, ●●●, ▲▲▲▲", "●, ●●, ▲▲▲, ▲▲▲▲", "▲, ▲▲, ●●●, ●●●●", "●, ▲, ●, ▲"], "correct": 0, "why": "Formen växlar cirkel/triangel och antalet ökar 1–4."}, {"q": "Tre strömbrytare styr en gammaldags glödlampa i ett annat rum. Du får gå in till lampan en enda gång. Hur identifierar du rätt brytare?", "a": ["Slå på alla", "Slå på en, vänta, slå av, slå på en annan och känn lampans värme", "Slå av alla och gissa", "Det är omöjligt"], "correct": 1, "why": "Lampan kan vara tänd, släckt men varm, eller släckt och kall."}, {"q": "Vilken slutsats är säker? ”Vissa konstnärer är musiker. Alla musiker är kreativa.”", "a": ["Alla konstnärer är kreativa", "Vissa konstnärer är kreativa", "Ingen konstnär är kreativ", "Alla kreativa är musiker"], "correct": 1, "why": "De konstnärer som är musiker är också kreativa."}, {"q": "Vilket alternativ är en giltig logisk slutsats? ”Om A så B. Inte B.”", "a": ["A", "Inte A", "B", "Inget går att säga"], "correct": 1, "why": "Modus tollens: om A innebär B och B är falskt, är A falskt."}];let pos=0,points=0,locked=false;const $=id=>document.getElementById(id);function render(){locked=false;let x=questions[pos];$('counter').textContent='Fråga '+(pos+1)+' av '+questions.length+' · '+points+' rätt';$('fill').style.width=(100*pos/questions.length)+'%';$('question').textContent=x.q;$('options').innerHTML='';$('explanation').classList.add('hidden');$('next').classList.add('hidden');x.a.forEach((answer,i)=>{let b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+answer;b.onclick=()=>choose(i);$('options').appendChild(b)})}function choose(i){if(locked)return;locked=true;let x=questions[pos];if(i===x.correct)points++;[...$('options').children].forEach((b,j)=>{b.disabled=true;if(j===x.correct)b.classList.add('good');else if(j===i)b.classList.add('bad')});$('explanation').textContent=(i===x.correct?'✅ Rätt! ':'❌ Inte riktigt. ')+x.why;$('explanation').classList.remove('hidden');$('next').textContent=pos===questions.length-1?'Visa resultat 🏆':'Nästa fråga →';$('next').classList.remove('hidden')}function nextQuestion(){pos++;if(pos===questions.length){$('game').classList.add('hidden');$('end').classList.remove('hidden');$('score').textContent=points+' av '+questions.length+' rätt';$('rating').textContent=points>=45?'Fantastiskt resultat!':points>=35?'Mycket starkt!':points>=25?'Bra kämpat!':'Fortsätt utmana hjärnan!';window.scrollTo(0,0)}else render()}function restart(){pos=0;points=0;$('end').classList.add('hidden');$('game').classList.remove('hidden');render();window.scrollTo(0,0)}function shareResult(){let s='🧠 Hjärnmatchen IQ 120: Jag fick '+points+'/50 rätt! Utmana mig: https://patrik778.github.io/1-klubben/hjarnmatchen-iq120-50.html';if(navigator.share){navigator.share({title:'Hjärnmatchen IQ 120',text:s}).catch(()=>{})}else if(navigator.clipboard){navigator.clipboard.writeText(s).then(()=>alert('Resultatet kopierat!')).catch(()=>prompt('Kopiera resultatet:',s))}else prompt('Kopiera resultatet:',s)}render();</script></body></html>

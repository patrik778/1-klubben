<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Surdegsmästaren – 20 svåra frågor</title><style>*{box-sizing:border-box}body{margin:0;background:#101326;color:#fff;font:18px system-ui,Arial,sans-serif}main{max-width:680px;margin:35px auto;padding:20px}h1{font-size:30px}p{line-height:1.5}.muted{color:#c0c8db}.panel{background:#202844;border-radius:18px;padding:22px}button{display:block;width:100%;text-align:left;border:0;border-radius:12px;background:#345be6;color:white;padding:17px;margin:12px 0;font-size:17px;cursor:pointer}button:disabled{opacity:.75;cursor:default}.right{background:#187e5b!important}.wrong{background:#a33e4a!important}.secondary{background:#39425c}.hide{display:none}#feedback{padding:10px 0;line-height:1.5}small{color:#c0c8db}</style></head><body><main><h1>🍞 Surdegsmästaren</h1><p class="muted">20 svåra frågor om surdeg och brödbakning. Ett svar per fråga. Facit med förklaring efter varje svar.</p><div class="panel"><div id="progress"></div><h2 id="question"></h2><div id="answers"></div><div id="feedback" aria-live="polite"></div><button id="next" class="secondary hide">Nästa fråga →</button><div id="end" class="hide"></div></div><p><small>Spela själv och dela ditt resultat med vänner.</small></p></main><script>const questions=[{"q": "Vilken förändring sker normalt när en mogen surdeg fermenterar?", "a": ["pH stiger och syran minskar", "pH sjunker när organiska syror bildas", "All stärkelse omvandlas till alkohol", "Gluten bildas av mjölksyrabakterier"], "correct": 1, "why": "Mjölksyrabakterier bildar bland annat mjölksyra och ättiksyra, vilket sänker pH."}, {"q": "Vad betyder 100 % hydrering i en surdeg?", "a": ["100 g vatten per 100 g mjöl", "100 g vatten per 200 g mjöl", "100 g mjöl per 200 g vatten", "Ingen extra vätska i degen"], "correct": 0, "why": "Hydrering räknas som vattnets vikt dividerad med mjölets vikt."}, {"q": "Vilken gas står främst för jäslyftet i en aktiv surdeg?", "a": ["Kväve", "Syre", "Koldioxid", "Väte"], "correct": 2, "why": "Jäst och vissa bakterier producerar koldioxid som fångas i degens struktur."}, {"q": "Varför kan en surdeg nå sin topp snabbare vid 28 °C än vid 20 °C?", "a": ["Högre temperatur påskyndar ofta mikroorganismernas aktivitet", "Mjölet innehåller mer protein vid 28 °C", "Vatten avdunstar alltid helt", "Syrorna neutraliseras"], "correct": 0, "why": "Temperaturen påverkar jäsningshastigheten, även om optimal temperatur varierar mellan kulturer."}, {"q": "Vilket påstående om surdegens jäst och mjölksyrabakterier är mest korrekt?", "a": ["Båda är samma organism", "Jäst bidrar ofta med gas och bakterier med syror", "Bakterier bildar alltid allt gluten", "Jäst kan bara leva utan syre"], "correct": 1, "why": "Surdeg är ett samspel mellan jäst och mjölksyrabakterier med delvis olika roller."}, {"q": "Vad innebär en matning i förhållandet 1:3:3?", "a": ["1 del vatten, 3 delar salt, 3 delar mjöl", "1 del mjöl, 3 delar surdeg, 3 delar vatten", "1 del surdeg, 3 delar mjöl, 3 delar vatten", "1 del surdeg, 3 delar salt, 3 delar vatten"], "correct": 2, "why": "Förhållandet avser vanligen surdegsstart, nytt mjöl och nytt vatten i vikt."}, {"q": "Vad kan hända med degen vid mycket lång, sur fermentering?", "a": ["Proteolys kan försvaga degens struktur", "Gluten blir alltid starkare utan gräns", "Stärkelsen blir helt opåverkad", "Degen kan inte överjäsa"], "correct": 0, "why": "Enzymer och sur miljö kan med tiden bidra till att glutennätverket försvagas."}, {"q": "Varför är fullkornsrågmjöl ofta effektivt för att starta en ny surdeg?", "a": ["Det saknar mikroorganismer", "Det har ofta mer mineraler och tillgängliga näringsämnen", "Det innehåller inget vatten", "Det gör kulturen steril"], "correct": 1, "why": "Fullkorn och råg kan ge mikroorganismerna god tillgång till näring."}, {"q": "Vad är autolys i klassisk brödbakning?", "a": ["Att frysa surdegen före bakning", "Att värma jästen till 70 °C", "Att blanda mjöl och vatten och låta det vila före övriga ingredienser", "Att tillsätta salt före mjöl"], "correct": 2, "why": "Klassisk autolys är vila för mjöl och vatten innan salt och jäsmedel blandas i."}, {"q": "Vilken effekt har salt vanligen på degens fermentering?", "a": ["Det påskyndar alltid jäsningen kraftigt", "Det hämmar ofta fermenteringshastigheten något", "Det dödar alltid all jäst omedelbart", "Det omvandlas till koldioxid"], "correct": 1, "why": "Salt påverkar både degens struktur och mikroorganismernas aktivitet."}, {"q": "Vad visar ett flyttest med surdeg mest tillförlitligt?", "a": ["Exakt hur surt brödet blir", "Att surdegen är fri från oönskade mikroorganismer", "Att provet håller kvar tillräckligt med gas för att flyta", "Exakt när bulkjäsningen är färdig"], "correct": 2, "why": "Flytförmåga beror på gas och konsistens och är inget säkert ensamt mognadstest."}, {"q": "Vad betyder degens \"bulkfermentering\"?", "a": ["Jäsningen av hela degen före slutformning", "Jäsningen efter att brödet är färdiggräddat", "Endast tiden i kylskåp", "Att man bakar flera limpor samtidigt"], "correct": 0, "why": "Bulkfermentering är den första jäsningsfasen efter blandning, före delning och formning."}, {"q": "Vilken observation är ett starkt tecken på överjäst deg?", "a": ["Degen är elastisk och håller formen väl", "Degen är mycket slapp, kollapsar och håller dåligt spänning", "Degen har en jämn, spänd yta", "Degen har nyss blandats"], "correct": 1, "why": "Överjäst deg kan tappa gas och struktur och bli svår att forma."}, {"q": "Varför används vikningar under bulkjäsning?", "a": ["För att ta bort allt vatten", "För att utveckla struktur och fördela temperatur och gas", "För att neutralisera all syra", "För att omvandla protein till stärkelse"], "correct": 1, "why": "Vikningar kan stärka degens nätverk utan intensiv knådning."}, {"q": "Vad innebär 75 % total hydrering i en deg med 800 g totalt mjöl?", "a": ["400 g vatten", "500 g vatten", "600 g vatten", "750 g vatten"], "correct": 2, "why": "0,75 × 800 g = 600 g vatten, inklusive vatten från surdegsstarten."}, {"q": "Vilket påstående om kyljäsning är mest korrekt?", "a": ["Jäsningen upphör alltid helt vid 4 °C", "Kyla bromsar jäsningen men stoppar den inte nödvändigtvis", "Kyla skapar automatiskt mer glutenprotein", "Kyljäsning eliminerar all syra"], "correct": 1, "why": "Kylning saktar ner mikrobiell aktivitet; degen kan fortsätta mogna långsamt."}, {"q": "Vad är huvudsyftet med att snitta en formad limpa före gräddning?", "a": ["Att styra var brödet expanderar i ugnen", "Att tillsätta mer jäst", "Att minska mängden mjöl i degen", "Att stoppa all enzymaktivitet före uppvärmning"], "correct": 0, "why": "Snitt ger kontrollerade svaga punkter för ugnsspringet."}, {"q": "Varför används ånga i början av gräddningen av många surdegsbröd?", "a": ["För att frysa skorpan", "För att fördröja skorpbildning och gynna expansion", "För att avlägsna allt vatten från brödet", "För att neutralisera surdegen"], "correct": 1, "why": "Fuktig ugnsmiljö håller ytan töjbar en stund och kan förbättra ugnsspring och skorpa."}, {"q": "Vilket ämne i mjöl bryter amylas främst ned?", "a": ["Salt", "Stärkelse", "Glutenprotein", "Mjölksyra"], "correct": 1, "why": "Amylaser bryter ned stärkelse till mindre kolhydrater som kan bidra till fermenteringen."}, {"q": "Varför kan en surdeg dofta tydligt av aceton eller lösningsmedel efter lång tid utan matning?", "a": ["Det bevisar att den innehåller giftigt lösningsmedel", "Det kan bero på ansamling av flyktiga fermenteringsprodukter i en hungrig kultur", "Det betyder att all jäst är död", "Det betyder alltid att pH är exakt 7"], "correct": 1, "why": "En kraftig lösningsmedelslik doft kan uppstå när kulturen är obalanserad eller länge omatad; kontrollera även synliga tecken på förskämning."}];let i=0,score=0,answered=false;const el=id=>document.getElementById(id);function render(){answered=false;el('progress').textContent='Fråga '+(i+1)+' av '+questions.length+' · Poäng: '+score;el('question').textContent=questions[i].q;el('answers').replaceChildren();el('feedback').textContent='';el('next').classList.add('hide');questions[i].a.forEach((answer,j)=>{let b=document.createElement('button');b.textContent=String.fromCharCode(65+j)+'. '+answer;b.addEventListener('click',()=>choose(j));el('answers').appendChild(b)})}function choose(j){if(answered)return;answered=true;let q=questions[i];if(j===q.correct)score++;[...el('answers').children].forEach((b,k)=>{b.disabled=true;if(k===q.correct)b.classList.add('right');else if(k===j)b.classList.add('wrong')});el('feedback').textContent=(j===q.correct?'✓ Rätt! ':'✗ Fel. Rätt svar: '+String.fromCharCode(65+q.correct)+'. ')+q.why;el('progress').textContent='Fråga '+(i+1)+' av '+questions.length+' · Poäng: '+score;el('next').textContent=i===questions.length-1?'Visa resultat →':'Nästa fråga →';el('next').classList.remove('hide')}el('next').addEventListener('click',()=>{i++;if(i<questions.length)render();else finish()});function finish(){el('progress').textContent='Klart!';el('question').textContent='Du fick '+score+' av '+questions.length+' rätt!';el('answers').replaceChildren();el('feedback').textContent=score>=17?'Imponerande surdegskunskaper!':score>=12?'Bra jobbat!':'Nu vet du vad du kan träna vidare på.';el('next').classList.add('hide');let e=el('end');e.classList.remove('hide');e.replaceChildren();let share=document.createElement('button');share.textContent='Dela mitt resultat';share.onclick=()=>{let t='🍞 Jag fick '+score+'/20 rätt i Surdegsmästaren! Testa du också: '+location.href;if(navigator.share)navigator.share({text:t}).catch(()=>{});else if(navigator.clipboard)navigator.clipboard.writeText(t).then(()=>alert('Resultatet kopierat!')).catch(()=>prompt('Kopiera resultatet:',t));else prompt('Kopiera resultatet:',t)};e.appendChild(share);let restart=document.createElement('button');restart.className='secondary';restart.textContent='Spela igen';restart.onclick=()=>{i=0;score=0;e.classList.add('hide');render()};e.appendChild(restart)}render();</script></body></html>

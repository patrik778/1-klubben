<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>Hjärnmatchen – Vardag, mat, hälsa, teknik, verktyg och bygg</title><style>*{box-sizing:border-box}body{margin:0;background:#101326;color:#fff;font-family:Arial,sans-serif}main{max-width:650px;margin:0 auto;padding:24px 18px 60px}h1{font-size:28px}p{line-height:1.5;color:#cbd5e1}.tag{display:inline-block;background:#393b73;padding:7px 12px;border-radius:20px;font-weight:bold}.card{background:#1c2340;border-radius:18px;padding:22px;margin:20px 0}button{display:block;width:100%;padding:17px;margin:12px 0;border:0;border-radius:12px;background:#2563eb;color:white;font-size:18px;text-align:left;cursor:pointer}button:disabled{opacity:.75;cursor:default}.right{background:#15803d!important}.wrong{background:#b91c1c!important}.secondary{background:#7c3aed;text-align:center}#next{background:#16a34a;text-align:center}#feedback{font-weight:bold;color:#fff}.muted{color:#a9b7ce;font-size:14px}a{color:#a5b4fc}#progress{font-weight:bold}</style></head><body><main><h1>🧠 Hjärnmatchen – 50 frågor</h1><p>Vardag • Mat • Hälsa • Teknik • Verktyg • Bygg</p><div id="progress">Fråga 1 av 50</div><div class="card"><span class="tag" id="category"></span><h2 id="question"></h2><div id="answers"></div><p id="feedback" aria-live="polite"></p><button id="next" hidden>Nästa fråga →</button></div><div id="end" hidden><h2 id="result"></h2><p>Utmana dina vänner med samma 50 frågor!</p><button class="secondary" id="share">Dela resultat</button><button id="again">Spela igen</button></div><p class="muted">Ett fristående spel i 1%-klubben. Alla frågor har ett rätt svar.</p><p><a href="index.html">← Till alla spel</a></p></main><script>const questions=[{"cat": "Vardag", "q": "Vad betyder märkningen 40 °C på ett tvättråd?", "a": ["Lägsta temperatur", "Stryktemperatur", "Torktemperatur", "Högsta rekommenderade tvättemperatur"], "correct": 3}, {"cat": "Vardag", "q": "Vilken enhet används för att mäta elektrisk energi på elräkningen?", "a": ["kWh", "Ampere", "kW", "Volt"], "correct": 0}, {"cat": "Vardag", "q": "Vilket material sorteras vanligtvis som metallförpackning?", "a": ["Keramikkopp", "Dricksglas", "Stekpanna", "Konservburk"], "correct": 3}, {"cat": "Vardag", "q": "Vad är en effektiv metod för att minska kondens på insidan av fönster?", "a": ["Öka luftfuktigheten", "Täcka ventilationsdon", "Förbättra ventilationen", "Stänga alla innerdörrar"], "correct": 2}, {"cat": "Vardag", "q": "Vad innebär en självrisk i en försäkring?", "a": ["Årlig rabatt", "Beloppet du betalar själv vid en skada", "Försäkringens löptid", "Högsta ersättning"], "correct": 1}, {"cat": "Vardag", "q": "Vad händer med kokpunkten för vatten på hög höjd?", "a": ["Den sjunker", "Vattnet kan inte koka", "Den stiger", "Den är alltid exakt 100 °C"], "correct": 0}, {"cat": "Vardag", "q": "Vilken brandsläckare är ofta lämplig för flera vanliga brandtyper i hemmet?", "a": ["Ingen släckare", "Endast brandfilt", "Pulversläckare", "Endast vattenkanna"], "correct": 2}, {"cat": "Vardag", "q": "Vad betyder att ett pris anges inklusive moms?", "a": ["Moms ingår", "Priset är utan skatt", "Priset gäller bara företag", "Moms tillkommer"], "correct": 0}, {"cat": "Mat", "q": "Vad får en majonnäs främst att hålla ihop olja och vatten?", "a": ["Kokning av oljan", "Socker", "Emulgering med äggula", "Saltets kristaller"], "correct": 2}, {"cat": "Mat", "q": "Vilken del av vetekornet innehåller mest fiber?", "a": ["Stärkelsekärnan", "Vattnet", "Grodden", "Kliet"], "correct": 3}, {"cat": "Mat", "q": "Vad händer främst vid Maillardreaktionen?", "a": ["Fett omvandlas till salt", "Smak och bryning utvecklas av värme", "Mat blir syrlig", "Vatten fryser"], "correct": 1}, {"cat": "Mat", "q": "Vilket livsmedel är naturligt rikt på vitamin B12?", "a": ["Ris", "Äpple", "Gurka", "Ägg"], "correct": 3}, {"cat": "Mat", "q": "Vad är huvudskillnaden mellan bakpulver och bikarbonat?", "a": ["De är identiska correct": 1}, {"cat": "Teknik", "q": "Vad betyder IP67 på en apparat?", "a": ["Trådlös räckvidd", "Batterikapacitet", "Att den alltid är vattentät på alla djup", "Skydd mot damm och tillfällig nedsänkning i vatten"], "correct": 3}, {"cat": "Teknik", "q": "Vilken anslutning överför vanligtvis både digital bild och ljud?", "a": ["USB-A enbart för laddning", "VGA", "3,5 mm analog ljudkontakt", "HDMI"], "correct": 3}, {"cat": "Teknik", "q": "Vad är en routers huvudsakliga uppgift i hemnätverket?", "a": ["Ladda mobilbatterier", "Lagra alla foton automatiskt", "Förstärka TV-bildens ljus", "Förmedla trafik mellan nätverk"], "correct": 3}, {"cat": "Teknik", "q": "Vad står SSD för?", "a": ["Smart Screen Driver", "Solid State Drive", "Serial Sound Device", "System Signal Display"], "correct": 1}, {"cat": "Teknik", "q": "Vilket frekvensband ger ofta bättre räckvidd genom väggar i ett hem?", "a": ["Alla har alltid exakt samma räckvidd", "6 GHz", "2,4 GHz", "5 GHz"], "correct": 2}, {"cat": "Teknik", "q": "Vad gör en jordfelsbrytare?", "a": ["Höjer nätspänningen", "Mäter internettrafik", "Bryter vid upptäckt felström till jord", "Ersätter alltid säkringar"], "correct": 2}, {"cat": "Teknik", "q": "Vad betyder tvåfaktorsautentisering?", "a": ["Två användarnamn", "Två oberoende verifieringssteg", "Två Wi-Fi-nät", "Två webbläsare"], "correct": 1}, {"cat": "Teknik", "q": "Vad är skillnaden mellan watt och wattimmar?", "a": ["Watt är energi, wattimmar är spänning", "Ingen skillnad", "Båda mäter längd", "Watt är effekt, wattimmar är energi"], "correct": 3}, {"cat": "Verktyg", "q": "Vilket verktyg används för att fräsa ett spår med jämnt djup i trä?", "a": ["Bågfil", "Polygrip", "Plåtsax", "Handöverfräs"], "correct": 3}, {"cat": "Verktyg", "q": "Vad är fördelen med en sänksåg på styrskena?", "a": ["Den borrar hål", "Den svetsar metall", "Raka och precisa snitt i skivmaterial", "Den ersätter skyddsglasögon"], "correct": 2}, {"cat": "Verktyg", "q": "Vad betyder märkningen TPI på ett sågblad?", "a": ["Total bladlängd", "Tänder per tum", "Varv per minut", "Tryck per tum"], "correct": 1}, {"cat": "Verktyg", "q": "Vilket verktyg används för att kontrollera en exakt 90-gradersvinkel?", "a": ["Skiftnyckel", "Slägga", "Stämjärn", "Vinkelhake"], "correct": 3}, {"cat": "Verktyg", "q": "Varför förborrar man ofta nära kanten på en träbit?", "a": ["För att öka friktionen", "För att minska risken att träet spricker", "För att göra skruven magnetisk", "För att färgen ska torka"], "correct": 1}, {"cat": "Verktyg", "q": "Vilken typ av slipmaskin är lämplig för finare planslipning av MDF?", "a": ["Rörtång", "Kap- och gersåg", "Excenterslip", "Bilningshammare"], "correct": 2}, {"cat": "Verktyg", "q": "Vad är en momentnyckel avsedd för?", "a": ["Mäta temperatur", "Kontrollera luftfuktighet", "Såga rör", "Dra åt med ett bestämt vridmoment"], "correct": 3}, {"cat": "Verktyg", "q": "Vad är skillnaden mellan slagborr och borrhammare?", "a": ["De är alltid samma maskin", "Slagborren fungerar bara i trä", "Borrhammaren använder en separat slagmekanism", "Borrhammaren saknar rotation"], "correct": 2}, {"cat": "Verktyg", "q": "Vilken skyddsutrustning är särskilt viktig vid sågning av MDF?", "a": ["Ingen utrustning behövs", "Endast knäskydd", "Endast arbetshandskar", "Effektivt andningsskydd och dammutsug"], "correct": 3}, {"cat": "Bygg", "q": "Vad är syftet med en ångbroms i en byggnadskonstruktion?", "a": ["Ersätta all ventilation", "Bära takstolar", "Öka elförbrukningen", "Begränsa fukttransport genom diffusion"], "correct": 3}, {"cat": "Bygg", "q": "Vad betyder cc 600 i en regelvägg?", "a": ["600 mm regelbredd", "600 mm mellan reg­larnas centrum", "600 cm mellan reglar", "600 mm fri öppning"], "correct": 1}, {"cat": "Bygg", "q": "Vad är en syll i en träregelvägg?", "a": ["Den nedersta horisontella regeln", "En isoleringsmatta", "En skruvtyp", "En takpanna"], "correct": 0}, {"cat": "Bygg", "q": "Vilket skivmaterial används ofta för släta, målade platsbyggda möbler?", "a": ["MDF", "Mineralull", "Korrugerad takplåt", "Cellplast"], "correct": 0}, {"cat": "Bygg", "q": "Vad är ett U-värde inom bygg?", "a": ["Mått på ljudstyrka", "Mått på väggens färg", "Mått på golvets lutning", "Mått på värmegenomgång genom en byggnadsdel"], "correct": 3}, {"cat": "Bygg", "q": "Varför lämnas ofta rörelsefog vid ett flytande trägolv?", "a": ["För att göra golvet mjukare", "För att hålla fogarna fyllda med vatten", "För att skapa ventilation i rummet", "För att golvet ska kunna svälla och krympa"], "correct": 3}, {"cat": "Bygg", "q": "Vilken uppgift har en överliggare ovanför en dörröppning i en bärande vägg?", "a": ["Täta fönsterglas", "Mäta väggens fukt", "Föra laster förbi öppningen", "Förhindra all ljudöverföring"], "correct": 2}, {"cat": "Bygg", "q": "Vad används armering i betong främst till?", "a": ["Minska betongens vikt till noll", "Ersätta all ballast", "Ta upp dragkrafter", "Göra betongen genomskinlig"], "correct": 2}, {"cat": "Bygg", "q": "Vad innebär kapillärbrytande skikt under en platta på mark?", "a": ["Är alltid ett plastgolv", "Ersätter armering", "Ökar vattenuppsugningen", "Minskar uppsugning av markfukt"], "correct": 3}];let index=0,score=0,answered=false;const el=id=>document.getElementById(id);function render(){answered=false;let x=questions[index];el('progress').textContent='Fråga '+(index+1)+' av '+questions.length+' • Poäng: '+score;el('category').textContent=x.cat;el('question').textContent=x.q;el('answers').innerHTML='';el('feedback').textContent='';el('next').hidden=true;x.a.forEach((v,i)=>{let b=document.createElement('button');b.textContent=String.fromCharCode(65+i)+'. '+v;b.onclick=()=>choose(i);el('answers').appendChild(b)})}function choose(i){if(answered)return;answered=true;let x=questions[index];if(i===x.correct)score++;let buttons=el('answers').querySelectorAll('button');buttons.forEach((b,j)=>{b.disabled=true;if(j===x.correct)b.classList.add('right');else if(j===i)b.classList.add('wrong')});el('feedback').textContent=i===x.correct?'✓ Rätt svar!':'✗ Rätt svar: '+x.a[x.correct];el('next').hidden=false;el('next').textContent=index===questions.length-1?'Visa resultat →':'Nästa fråga →'}el('next').onclick=()=>{index++;if(index===questions.length){el('progress').textContent='Klart!';document.querySelector('.card').hidden=true;el('end').hidden=false;el('result').textContent='Du fick '+score+' av '+questions.length+' rätt!'}else render()};el('again').onclick=()=>{index=0;score=0;document.querySelector('.card').hidden=false;el('end').hidden=true;render()};el('share').onclick=()=>{let t='Jag fick '+score+' av '+questions.length+' rätt i Hjärnmatchen – vardag, mat, hälsa, teknik, verktyg & bygg! Testa du också: '+location.href;if(navigator.share){navigator.share({text:t}).catch(()=>{navigator.clipboard&&navigator.clipboard.writeText(t).then(()=>alert('Resultatet kopierat!'))})}else if(navigator.clipboard){navigator.clipboard.writeText(t).then(()=>alert('Resultatet kopierat!')).catch(()=>prompt('Kopiera resultatet:',t))}else prompt('Kopiera resultatet:',t)};render();</script></body></html>

<!doctype html>
<html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Matexperten | 1%-klubben</title><style>
:root{font-family:system-ui,-apple-system,Segoe UI,sans-serif;color-scheme:dark;background:#101827;color:#f8fafc}*{box-sizing:border-box}body{margin:0;min-height:100vh;display:grid;place-items:center;padding:20px}.app{width:min(100%,660px);background:#1b2739;border:1px solid #354358;border-radius:22px;padding:clamp(20px,5vw,36px);box-shadow:0 16px 50px #0005}h1{font-size:clamp(26px,6vw,38px);margin:0 0 6px}h2{font-size:clamp(21px,4vw,27px);line-height:1.35}p{line-height:1.5}.muted{color:#b8c4d5}.top{display:flex;justify-content:space-between;gap:10px;flex-wrap:wrap}.pill{background:#33435c;border-radius:30px;padding:7px 12px;font-size:14px}.bar{height:9px;background:#34435a;border-radius:9px;overflow:hidden;margin:22px 0}.fill{height:100%;width:0;background:#f5bc51;transition:width .2s}.answers{display:grid;gap:10px;margin:20px 0}.choice{width:100%;text-align:left;border:1px solid #50617a;background:#26364c;color:inherit;padding:16px;border-radius:12px;font:inherit;cursor:pointer}.choice:hover:not(:disabled){border-color:#f5bc51}.choice:disabled{cursor:default;opacity:.8}.choice.correct{border-color:#50d3a1;background:#1d5149;opacity:1}.choice.wrong{border-color:#fb8888;background:#67363f;opacity:1}.primary{border:0;background:#f5bc51;color:#182232;font-weight:750;border-radius:12px;padding:14px 20px;font-size:16px;cursor:pointer;width:100%}.primary:disabled{opacity:.5;cursor:not-allowed}.feedback{padding:14px;border-radius:12px;background:#29394e;margin-bottom:16px}.hidden{display:none}.score{font-size:58px;font-weight:800;color:#f5bc51;text-align:center;margin:18px 0}.foot{text-align:center;font-size:13px;color:#aebed0;margin-top:22px}
</style></head><body><main class="app"><header><div class="top"><span class="pill">🏆 1%-klubben</span><span class="pill" id="counter">Fråga 1 av 15</span></div><h1>🍽️ Matexperten</h1><p class="muted">15 svåra frågor om mat och gastronomi. Ett svar per fråga.</p></header><div class="bar"><div class="fill" id="fill"></div></div><section id="game"><div class="top"><span id="category" class="muted"></span><strong id="points">Poäng: 0</strong></div><h2 id="question"></h2><div id="answers" class="answers"></div><div id="feedback" class="feedback hidden" aria-live="polite"></div><button id="next" class="primary hidden">Nästa fråga</button></section><section id="result" class="hidden"><h2 style="text-align:center">🎉 Spelet är klart!</h2><div class="score" id="finalscore"></div><p id="assessment" style="text-align:center"></p><button class="primary" id="restart">Spela igen</button></section><div class="foot">Matexperten • Ett fristående spel i 1%-klubben</div></main><script>
const questions=[
{c:'Teknik',q:'Vad innebär matlagningstekniken sous-vide?',a:['Att tillaga mat i en försluten påse vid noggrant kontrollerad temperatur','Att steka mat under högt tryck','Att långsamt röka mat med kall rök','Att ångkoka mat under vakuum'],k:0,e:'Sous-vide betyder ”under vakuum” och använder noggrant kontrollerad temperatur, ofta i vattenbad.'},
{c:'Franska köket',q:'Vilken av följande såser är en av Auguste Escoffiers fem klassiska modersåser?',a:['Béarnaise','Velouté','Chimichurri','Pesto'],k:1,e:'Velouté är en av de fem modersåserna tillsammans med béchamel, espagnole, tomatsås och hollandaise.'},
{c:'Japanska köket',q:'Vad är koji i traditionell japansk fermentering?',a:['En torkad sjöalg','En sorts jästsvamp för brödbak','Ett spannmål eller annan råvara odlad med mögelsvampen Aspergillus oryzae','En fermenterad fiskbuljong'],k:2,e:'Koji görs genom att odla Aspergillus oryzae på exempelvis ris eller korn; dess enzymer bryter ned stärkelse och proteiner.'},
{c:'Råvarukunskap',q:'Vilken av dessa är en äkta kaviar från stör?',a:['Löjrom','Tobiko','Masago','Belugakaviar'],k:3,e:'Belugakaviar kommer från belugastör. Löjrom, tobiko och masago kommer från andra fiskarter.'},
{c:'Italienska köket',q:'Vilken risvariant är särskilt känd för sin användning i krämig risotto tack vare hög stärkelsehalt?',a:['Carnaroli','Basmati','Jasminris','Vildris'],k:0,e:'Carnaroli är ett klassiskt italienskt risottoris som håller formen väl och ger krämig konsistens.'},
{c:'Smaklära',q:'Vilket ämne är främst förknippat med umamismak i exempelvis lagrad parmesan?',a:['Koffein','Glutamat','Sackaros','Mentol'],k:1,e:'Fritt glutamat bidrar till umamismaken i bland annat lagrad ost, tomat och buljong.'},
{c:'Fransk gastronomi',q:'Vad beskriver termen ”en papillote” i matlagning?',a:['Att pochera i olja','Att grilla över träkol','Att tillaga maten innesluten i ett paket, ofta av bakplåtspapper','Att marinera i vin över natten'],k:2,e:'En papillote betyder att maten tillagas i ett slutet paket där ångan och aromerna hålls kvar.'},
{c:'Spanska köket',q:'Vilken ingrediens ger traditionell svart paella, arroz negro, dess färg?',a:['Svart vitlök','Bläck från bläckfisk','Rostat rispulver','Svarta bönor'],k:1,e:'Arroz negro färgas med bläck från bläckfisk eller tioarmad bläckfisk.'},
{c:'Livsmedelskemi',q:'Vad är Maillardreaktionen?',a:['En reaktion mellan aminosyror och reducerande sockerarter som skapar brynta smaker','När socker smälter utan andra ämnen','När protein enbart koagulerar av syra','När fett härsknar av syre'],k:0,e:'Maillardreaktionen mellan aminosyror och reducerande sockerarter skapar många aromer och brynta ytor.'},
{c:'Ostkunskap',q:'Vilken mögelsvamp används traditionellt vid tillverkning av blåmögelost som Roquefort?',a:['Penicillium camemberti','Saccharomyces cerevisiae','Aspergillus niger','Penicillium roqueforti'],k:3,e:'Penicillium roqueforti ger blåmögelost dess karakteristiska ådring och smak.'},
{c:'Franska köket',q:'Vad är huvudråvaran i en klassisk beurre blanc?',a:['Crème fraîche','Äggula','Smör','Olivolja'],k:2,e:'Beurre blanc är en varm, emulgerad smörsås, ofta byggd på en reduktion av vin och schalottenlök.'},
{c:'Koreanska köket',q:'Vilken fermenterad chilipasta används ofta i koreansk matlagning?',a:['Harissa','Gochujang','Doubanjiang','Sambal oelek'],k:1,e:'Gochujang är en koreansk fermenterad chilipasta med både hetta, sötma och umami.'},
{c:'Konditori',q:'Vad är det som huvudsakligen får pâte à choux, exempelvis petit choux, att expandera i ugnen?',a:['Ånga från degens vatten','Bakpulver','Jäst','Vispad äggvita'],k:0,e:'Vatten i degen omvandlas till ånga och blåser upp bakverket innan strukturen stelnar.'},
{c:'Italienska köket',q:'Vad betyder ”al dente” när man talar om pasta?',a:['Helt mjukkokt','Kallsköljd efter kokning','Stekt efter kokning','Genomkokt men med ett visst tuggmotstånd'],k:3,e:'Al dente betyder ungefär ”till tanden” och innebär att pastan har kvar ett tydligt tuggmotstånd.'},
{c:'Gastronomihistoria',q:'Vilken fransk kock förknippas med uttrycket ”kockarnas kung och kungarnas kock”?',a:['Paul Bocuse','Alain Ducasse','Marie-Antoine Carême','Joël Robuchon'],k:2,e:'Marie-Antoine Carême (1784–1833) var en pionjär inom det klassiska franska haute cuisine-köket.'}
];
let index=0,score=0,locked=false;const el=id=>document.getElementById(id);
function render(){locked=false;const q=questions[index];el('counter').textContent=`Fråga ${index+1} av ${questions.length}`;el('fill').style.width=`${index/questions.length*100}%`;el('category').textContent=q.c;el('points').textContent=`Poäng: ${score}`;el('question').textContent=q.q;el('feedback').classList.add('hidden');el('next').classList.add('hidden');el('answers').replaceChildren();q.a.forEach((answer,i)=>{const b=document.createElement('button');b.className='choice';b.textContent=`${'ABCD'[i]}. ${answer}`;b.addEventListener('click',()=>choose(i));el('answers').append(b)})}
function choose(i){if(locked)return;locked=true;const q=questions[index];if(i===q.k)score++;[...el('answers').children].forEach((b,j)=>{b.disabled=true;if(j===q.k)b.classList.add('correct');else if(j===i)b.classList.add('wrong')});el('feedback').textContent=(i===q.k?'✅ Rätt! ':'❌ Fel. Rätt svar: '+ 'ABCD'[q.k]+'. '+q.a[q.k]+'. ')+q.e;el('feedback').classList.remove('hidden');el('points').textContent=`Poäng: ${score}`;el('next').textContent=index===questions.length-1?'Visa slutresultat':'Nästa fråga';el('next').classList.remove('hidden')}
el('next').addEventListener('click',()=>{index++;if(index<questions.length)render();else finish()});function finish(){el('game').classList.add('hidden');el('result').classList.remove('hidden');el('counter').textContent='Avslutat';el('fill').style.width='100%';el('finalscore').textContent=`${score} / ${questions.length}`;el('assessment').textContent=score>=13?'🏆 Fantastiskt! Du är en riktig matexpert.':score>=10?'🌟 Mycket bra! Du kan verkligen gastronomi.':score>=7?'👏 Bra jobbat! Du har goda gastronomikunskaper.':'🍳 Bra kämpat! Testa igen och slå ditt resultat.'}el('restart').addEventListener('click',()=>{index=0;score=0;el('result').classList.add('hidden');el('game').classList.remove('hidden');render()});render();
</script></body></html>

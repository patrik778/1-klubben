<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hjärnmatchen IQ 130 Mix – 50 frågor</title><style>*{box-sizing:border-box}body{margin:0;background:#0b1220;color:#f8fafc;font-family:system-ui,Arial,sans-serif}main{max-width:690px;margin:auto;padding:24px 16px 48px}h1{font-size:clamp(27px,6vw,40px);margin:12px 0}p{line-height:1.5;color:#cbd5e1}.pill{display:inline-block;background:#233a67;border-radius:20px;padding:7px 12px;font-size:13px}.card{background:#17233b;border:1px solid #334155;border-radius:20px;padding:22px;margin-top:20px}.meta{color:#93c5fd;font-weight:700;font-size:14px}.question{font-size:23px;font-weight:700;line-height:1.35;margin:16px 0 20px}.opt{display:block;width:100%;text-align:left;border:1px solid #475569;background:#24334d;color:white;border-radius:12px;padding:15px;margin:10px 0;font-size:17px;cursor:pointer}.opt:disabled{opacity:1;cursor:default}.opt.good{background:#14532d;border-color:#4ade80}.opt.bad{background:#7f1d1d;border-color:#f87171}.primary{background:#2563eb;border:0;border-radius:12px;color:white;padding:15px 20px;font-weight:700;font-size:17px;cursor:pointer;width:100%;margin-top:15px}.primary:disabled{opacity:.45;cursor:default}.feedback{background:#0f172a;border-radius:12px;padding:15px;margin-top:14px;line-height:1.5}.hide{display:none}.bar{height:8px;border-radius:10px;background:#334155;overflow:hidden;margin:14px 0}.fill{height:100%;background:#60a5fa;width:0%}.footer{text-align:center;color:#94a3b8;font-size:13px;margin-top:25px}</style></head><body><main><span class="pill">🏆 1%-klubben · 50 nya frågor</span><h1>🧠 Hjärnmatchen – IQ 130 Mix</h1><p>Logik, vardag, mat, hälsa, teknik och allmänbildning. Fyra alternativ per fråga, rättning och förklaring efter varje svar. IQ 130 är ett lekfullt svårighetstema, inte ett IQ-test.</p><section class="card" id="game"><div class="meta" id="progress"></div><div class="bar"><div class="fill" id="fill"></div></div><div class="meta" id="cat"></div><div class="question" id="question"></div><div id="options"></div><div id="feedback" class="feedback hide" aria-live="polite"></div><button id="next" class="primary hide">Nästa fråga →</button></section><section class="card hide" id="result"><h2>🎉 Klart!</h2><div class="question" id="score"></div><p id="summary"></p><button class="primary" id="share">📤 Dela resultat</button><button class="primary" id="again">🔁 Spela igen</button></section><div class="footer">Spela individuellt och jämför era resultat!</div></main><script>const questions=[{"cat": "Logik", "q": "Alla tulpaner är blommor. Vissa blommor vissnar snabbt. Vad kan man säkert säga?", "opts": ["Alla tulpaner vissnar snabbt", "Vissa tulpaner vissnar snabbt", "Tulpaner är blommor", "Inga tulpaner vissnar snabbt"], "ans": 2, "why": "Endast att tulpaner tillhör gruppen blommor följer säkert."}, {"cat": "Vardag", "q": "Varför kan en tät glasburk bli svårare att öppna efter att varmt innehåll svalnat?", "opts": ["Locket krymper alltid mer än glaset", "Trycket inne i burken kan bli lägre", "Glaset blir magnetiskt", "Gängorna smälter ihop"], "ans": 1, "why": "När innehållet svalnar kan undertryck bildas."}, {"cat": "Mat", "q": "Vilken process ger framför allt brynt stekyta på kött?", "opts": ["Fermentering", "Maillardreaktionen", "Pastörisering", "Osmos"], "ans": 1, "why": "Maillardreaktionen sker mellan bland annat aminosyror och sockerarter vid upphettning."}, {"cat": "Hälsa", "q": "Vad beskriver VO₂max?", "opts": ["Maximal lungvolym", "Maximal syreupptagningsförmåga", "Högsta möjliga puls", "Mängden syre i ett andetag"], "ans": 1, "why": "VO₂max anger kroppens maximala syreupptag vid intensiv ansträngning."}, {"cat": "Teknik", "q": "Vad betyder att en fil är krypterad?", "opts": ["Den är alltid komprimerad", "Den kan bara lagras i molnet", "Innehållet är omvandlat för att kräva rätt nyckel", "Den är automatiskt virusfri"], "ans": 2, "why": "Kryptering skyddar läsbarheten med en nyckel."}, {"cat": "Allmänbildning", "q": "Vilken av dessa städer ligger längst norrut?", "opts": ["Oslo", "Stockholm", "Helsingfors", "Köpenhamn"], "ans": 0, "why": "Oslo ligger något längre norrut än Helsingfors och Stockholm."}, {"cat": "Logik", "q": "Om påståendet ”Ingen i gruppen kan simma” är falskt, vad måste vara sant?", "opts": ["Alla kan simma", "Minst en kan simma", "Exakt en kan simma", "Ingen kan dyka"], "ans": 1, "why": "Negationen av ”ingen” är ”minst en”."}, {"cat": "Vardag", "q": "Varför bildas imma på utsidan av ett kallt glas?", "opts": ["Vatten läcker genom glaset", "Vattenånga i luften kondenserar", "Syre blir flytande", "Glaset avger fukt"], "ans": 1, "why": "Luftens vattenånga kondenserar på den kalla ytan."}, {"cat": "Mat", "q": "Vilken råvara används traditionellt för att göra tahini?", "opts": ["Kikärtor", "Sesamfrön", "Solroskärnor", "Mandel"], "ans": 1, "why": "Tahini är en pasta av sesamfrön."}, {"cat": "Hälsa", "q": "Vilket hormon hjälper normalt kroppens celler att ta upp glukos från blodet?", "opts": ["Melatonin", "Insulin", "Adrenalin", "Kortisol"], "ans": 1, "why": "Insulin reglerar bland annat glukosupptag och blodsocker."}, {"cat": "Teknik", "q": "Vilken uppgift har DNS på internet?", "opts": ["Kryptera all trafik", "Översätta domännamn till IP-adresser", "Lagra alla webbsidor", "Förbättra skärmens upplösning"], "ans": 1, "why": "DNS slår upp namn som exempel.se till nätverksadresser."}, {"cat": "Allmänbildning", "q": "Vilket ämne har kemisk beteckning W?", "opts": ["Volfram", "Vanadin", "Wolframium är en gas", "Väte"], "ans": 0, "why": "W står för volfram, från namnet wolfram."}, {"cat": "Logik", "q": "En klocka går fem minuter för fort. Du ställer den rätt, men den fortsätter gå för fort med samma hastighet som tidigare. Vad vet du?", "opts": ["Den kommer alltid visa rätt tid", "Den kan börja visa fel tid igen", "Den stannar efter en timme", "Den tappar automatiskt fem minuter"], "ans": 1, "why": "Att ställa klockan rätt ändrar inte dess gångavvikelse."}, {"cat": "Vardag", "q": "Varför kan en dörr kärva mer under fuktiga perioder?", "opts": ["Trä kan svälla när det tar upp fukt", "Gångjärn blir magnetiska", "Lufttrycket fördubblas", "Färgen blir tyngdlös"], "ans": 0, "why": "Trä är hygroskopiskt och kan ändra dimensioner med fukthalten."}, {"cat": "Mat", "q": "Vad är huvudingrediensen i klassisk pesto alla genovese?", "opts": ["Persilja", "Basilika", "Ruccola", "Spenat"], "ans": 1, "why": "Basilika är den karakteristiska örten i pesto genovese."}, {"cat": "Hälsa", "q": "Vad menas med progressiv överbelastning i styrketräning?", "opts": ["Att alltid träna till total utmattning", "Att gradvis öka träningskravet", "Att träna samma vikt för alltid", "Att aldrig vila mellan pass"], "ans": 1, "why": "Belastningen eller träningsvolymen ökas gradvis när kroppen anpassar sig."}, {"cat": "Teknik", "q": "Vilken teknik används främst för kontaktlös betalning när telefonen hålls nära terminalen?", "opts": ["NFC", "GPS", "HDMI", "LiDAR"], "ans": 0, "why": "NFC möjliggör kortdistanskommunikation mellan enheter."}, {"cat": "Allmänbildning", "q": "Vad skiljer en ö från en halvö?", "opts": ["En ö har alltid berg", "En ö omges av vatten", "En halvö är alltid större", "En ö saknar vägar"], "ans": 1, "why": "En ö är omgiven av vatten medan en halvö sitter ihop med land."}, {"cat": "Logik", "q": "Tre personer säger: A: ”B ljuger.” B: ”C ljuger.” C: ”A och B ljuger.” Om exakt en talar sanning, vem är det?", "opts": ["A", "B", "C", "Det går inte att avgöra"], "ans": 1, "why": "Om B talar sanning ljuger C, och A ljuger eftersom B inte ljuger."}, {"cat": "Vardag", "q": "Vilket material leder i allmänhet värme bäst?", "opts": ["Trä", "Luft", "Koppar", "Gummi"], "ans": 2, "why": "Koppar är en mycket god värmeledare."}, {"cat": "Mat", "q": "Vad är den viktigaste skillnaden mellan bakpulver och bikarbonat i bakning?", "opts": ["Bakpulver innehåller även syrakomponent", "Bikarbonat innehåller jästsvamp", "Bakpulver saknar helt bikarbonat", "Bikarbonat är ett protein"], "ans": 0, "why": "Bakpulver innehåller bikarbonat samt syra och ofta stärkelse."}, {"cat": "Hälsa", "q": "Vilken struktur i örat omvandlar ljudvibrationer till nervsignaler?", "opts": ["Trumhinnan ensam", "Snäckan (cochlea)", "Öronmusslan", "Örontrumpeten"], "ans": 1, "why": "Hårceller i snäckan omvandlar rörelser till nervsignaler."}, {"cat": "Teknik", "q": "Vad innebär tvåfaktorsautentisering?", "opts": ["Två lösenord i samma ruta", "Två olika typer av verifiering", "Två användarnamn", "Att logga in från två mobiler"], "ans": 1, "why": "Två oberoende faktorer, till exempel lösenord och autentiseringsapp, används."}, {"cat": "Allmänbildning", "q": "Vilken planet har längst omloppstid runt solen av dessa?", "opts": ["Mars", "Jupiter", "Saturnus", "Neptunus"], "ans": 3, "why": "Neptunus tar cirka 165 jordår på ett varv runt solen."}, {"cat": "Logik", "q": "Vilket ord passar sämst ihop med de andra?", "opts": ["Kilometer", "Liter", "Centimeter", "Millimeter"], "ans": 1, "why": "Liter är en volymenhet; de övriga är längdenheter."}, {"cat": "Vardag", "q": "Varför fungerar inte en vanlig kompass tillförlitligt precis intill en stor magnet?", "opts": ["Magneten påverkar kompassnålen", "Kompassnålen behöver solljus", "Jordens gravitation upphör", "Luften blir elektrisk"], "ans": 0, "why": "Det lokala magnetfältet stör jordfältets riktning."}, {"cat": "Mat", "q": "Vilken metod används för att göra en klassisk emulsion som majonnäs?", "opts": ["Blanda olja och vatten med emulgerande ämne", "Koka oljan till ånga", "Frysa äggulan", "Tillsätta jäst"], "ans": 0, "why": "Äggulans emulgerande ämnen hjälper olja att fördelas i små droppar."}, {"cat": "Hälsa", "q": "Vilken typ av muskelarbete sker när du långsamt sänker en hantel i en bicepscurl?", "opts": ["Koncentriskt", "Excentriskt", "Isometriskt hela vägen", "Inget muskelarbete"], "ans": 1, "why": "Muskeln utvecklar kraft samtidigt som den förlängs."}, {"cat": "Teknik", "q": "Vad är en vanlig fördel med fiberoptisk datakommunikation jämfört med kopparkabel?", "opts": ["Kräver ingen utrustning", "Är okänslig för elektromagnetiska störningar", "Kan aldrig gå sönder", "Använder ljudvågor"], "ans": 1, "why": "Optiska signaler påverkas inte på samma sätt av elektromagnetiska fält."}, {"cat": "Allmänbildning", "q": "Vilket språk tillhör den romanska språkfamiljen?", "opts": ["Tyska", "Finska", "Portugisiska", "Ungerska"], "ans": 2, "why": "Portugisiska utvecklades ur latin och är ett romanskt språk."}, {"cat": "Logik", "q": "Du vet att ”Om lampan lyser är strömmen på”. Lampan är släckt. Vad kan du säkert dra för slutsats?", "opts": ["Strömmen är av", "Strömmen är på", "Lampan är trasig", "Ingen säker slutsats om strömmen"], "ans": 3, "why": "Lampan kan vara släckt av flera skäl trots att strömmen är på."}, {"cat": "Vardag", "q": "Varför bör man inte hälla vatten på brinnande matolja?", "opts": ["Vattnet kan snabbt förångas och sprida brinnande olja", "Vattnet blir giftigt direkt", "Oljan fryser", "Vatten förstärker alltid syrehalten"], "ans": 0, "why": "Vattnet kan orsaka våldsam stänkning och sprida branden."}, {"cat": "Mat", "q": "Vilket påstående om gluten är korrekt?", "opts": ["Det är en typ av socker", "Det är ett samlingsnamn för proteiner i vissa spannmål", "Det finns i alla risarter", "Det är samma sak som laktos"], "ans": 1, "why": "Gluten består av proteiner i bland annat vete, råg och korn."}, {"cat": "Hälsa", "q": "Vad är den viktigaste funktionen hos hemoglobin?", "opts": ["Bryta ner fett", "Transportera syre i blodet", "Bildar skelett", "Lagra vitaminer i huden"], "ans": 1, "why": "Hemoglobin i röda blodkroppar binder och transporterar syre."}, {"cat": "Teknik", "q": "Vad betyder ”latens” i ett nätverk?", "opts": ["Hur mycket lagringsutrymme som finns", "Fördröjning innan data når fram", "Skärmens ljusstyrka", "Antalet installerade appar"], "ans": 1, "why": "Latens mäter fördröjningen i kommunikationen."}, {"cat": "Allmänbildning", "q": "Vilket land har flest tidszoner om utomeuropeiska territorier räknas med?", "opts": ["Ryssland", "Kina", "Frankrike", "Indien"], "ans": 2, "why": "Frankrikes många utomeuropeiska territorier ger landet flest tidszoner."}, {"cat": "Logik", "q": "I en låda finns bara röda och blå strumpor. Hur många måste du ta i mörkret för att garanterat få två av samma färg?", "opts": ["Två", "Tre", "Fyra", "Fem"], "ans": 1, "why": "Med två färger garanterar tre strumpor minst två av samma färg."}, {"cat": "Vardag", "q": "Varför används vattenpass vid montering av hyllor?", "opts": ["För att mäta temperatur", "För att kontrollera vågrätt eller lodrätt läge", "För att hitta elkablar", "För att mäta fukthalt"], "ans": 1, "why": "Vattenpass visar lutning i förhållande till gravitationen."}, {"cat": "Mat", "q": "Vilken av dessa är en baljväxt?", "opts": ["Quinoa", "Röd lins", "Bovete", "Hirs"], "ans": 1, "why": "Linser tillhör ärtväxterna och är baljväxter."}, {"cat": "Hälsa", "q": "Vad är kroppens främsta omedelbara energivaluta i cellerna?", "opts": ["ATP", "DNA", "Hemoglobin", "Kollagen"], "ans": 0, "why": "ATP används direkt i många energikrävande cellprocesser."}, {"cat": "Teknik", "q": "Vad gör en router i ett hemnätverk i första hand?", "opts": ["Skriver ut dokument", "Dirigerar datatrafik mellan nätverk", "Ökar batteriets kapacitet", "Ersätter alltid modem och fiberbox"], "ans": 1, "why": "En router förmedlar trafik mellan nätverk, exempelvis hemnät och internet."}, {"cat": "Allmänbildning", "q": "Vad är en arkipelag?", "opts": ["En bergskedja", "En ögrupp eller skärgård", "En typ av flod", "En undervattensvulkan"], "ans": 1, "why": "Arkipelag betyder ögrupp eller skärgård."}, {"cat": "Logik", "q": "Två fäder och två söner går på bio, men köper bara tre biljetter. Hur är det möjligt?", "opts": ["En smiter in", "Det är farfar, pappa och son", "En person har två platser", "De går olika dagar"], "ans": 1, "why": "Tre generationer kan vara två fäder och två söner samtidigt."}, {"cat": "Vardag", "q": "Varför är ett lock på kastrullen ofta energisparande?", "opts": ["Det ökar värmeförlusten", "Det minskar värmeförlust genom avdunstning", "Det sänker alltid kokpunkten", "Det gör metallen tunnare"], "ans": 1, "why": "Lock minskar avdunstning och värmeförlust."}, {"cat": "Mat", "q": "Vilken temperatur är ungefär den där rent vatten kokar vid normalt lufttryck?", "opts": ["80 °C", "90 °C", "100 °C", "120 °C"], "ans": 2, "why": "Vid normalt atmosfärstryck kokar rent vatten vid cirka 100 °C."}, {"cat": "Hälsa", "q": "Vilket organ producerar galla?", "opts": ["Bukspottkörteln", "Levern", "Mjälten", "Njurarna"], "ans": 1, "why": "Levern producerar galla, som lagras och koncentreras i gallblåsan."}, {"cat": "Teknik", "q": "Vad skiljer RAM från vanlig långtidslagring i en dator?", "opts": ["RAM är normalt flyktigt arbetsminne", "RAM är alltid större", "RAM lagrar bara bilder", "RAM fungerar utan elektricitet för alltid"], "ans": 0, "why": "RAM används för tillfälliga arbetsdata och är vanligen flyktigt."}, {"cat": "Allmänbildning", "q": "Vilket av följande är ett grundämne?", "opts": ["Vatten", "Koldioxid", "Grafit", "Salt"], "ans": 2, "why": "Grafit är en form av grundämnet kol."}, {"cat": "Logik", "q": "Vilken slutsats är logiskt giltig? ”Alla katter är däggdjur. Misse är en katt.”", "opts": ["Misse är ett däggdjur", "Alla däggdjur är katter", "Misse kan flyga", "Inga katter är däggdjur"], "ans": 0, "why": "Om alla katter är däggdjur och Misse är katt, är Misse däggdjur."}, {"cat": "Vardag", "q": "Varför ska man normalt ventilera när man målar med lösningsmedelsbaserad färg?", "opts": ["För att färgen ska bli blå", "För att minska halten lösningsmedelsångor", "För att öka luftfuktigheten maximalt", "För att undvika allt damm utomhus"], "ans": 1, "why": "Ventilation minskar exponeringen för ångor; följ alltid produktens säkerhetsanvisningar."}];let index=0,score=0,answered=false;const $=id=>document.getElementById(id);function render(){const x=questions[index];answered=false;$('progress').textContent='Fråga '+(index+1)+' av '+questions.length+' · '+score+' rätt';$('fill').style.width=(index/questions.length*100)+'%';$('cat').textContent=x.cat;$('question').textContent=x.q;$('feedback').classList.add('hide');$('next').classList.add('hide');$('options').replaceChildren();x.opts.forEach((option,i)=>{let b=document.createElement('button');b.className='opt';b.textContent=String.fromCharCode(65+i)+'. '+option;b.addEventListener('click',()=>choose(i));$('options').appendChild(b)})}function choose(i){if(answered)return;answered=true;let x=questions[index];if(i===x.ans)score++;Array.from($('options').children).forEach((b,j)=>{b.disabled=true;if(j===x.ans)b.classList.add('good');else if(j===i)b.classList.add('bad')});$('feedback').textContent=(i===x.ans?'✅ Rätt! ':'❌ Inte riktigt. Rätt svar: '+String.fromCharCode(65+x.ans)+'. '+x.opts[x.ans]+'. ')+x.why;$('feedback').classList.remove('hide');$('next').textContent=index===questions.length-1?'Visa resultat →':'Nästa fråga →';$('next').classList.remove('hide')}function finish(){$('game').classList.add('hide');$('result').classList.remove('hide');$('score').textContent=score+' av '+questions.length+' rätt';$('summary').textContent=score>=43?'Fantastiskt resultat!':score>=33?'Riktigt starkt jobbat!':score>=23?'Bra kämpat!':'Nu har du lärt dig massor – prova igen!'}$('next').addEventListener('click',()=>{index++;if(index>=questions.length)finish();else render()});$('again').addEventListener('click',()=>{index=0;score=0;$('result').classList.add('hide');$('game').classList.remove('hide');render()});$('share').addEventListener('click',async()=>{const s='Jag fick '+score+'/50 på Hjärnmatchen IQ 130 Mix! 🧠 Testa du också: '+location.href;try{if(navigator.share)await navigator.share({title:'Hjärnmatchen IQ 130 Mix',text:s});else if(navigator.clipboard){await navigator.clipboard.writeText(s);alert('Resultatet kopierat!')}else prompt('Kopiera resultatet:',s)}catch(e){if(e.name!=='AbortError')prompt('Kopiera resultatet:',s)}});render();</script></body></html>

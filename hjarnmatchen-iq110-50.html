<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hjärnmatchen – IQ 110 | 1%-klubben</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1630;color:#fff;font-family:system-ui,Arial,sans-serif}main{max-width:680px;margin:32px auto;padding:18px}h1{font-size:clamp(26px,5vw,38px);margin:12px 0}p,.muted{color:#b9c7e3}.panel{background:#1a294d;border:1px solid #304369;border-radius:24px;padding:25px;margin-top:24px}.top{display:flex;justify-content:space-between;gap:12px;color:#c8d6ef;font-size:14px}.track{height:9px;background:#304369;border-radius:12px;overflow:hidden;margin:18px 0 25px}.fill{height:100%;background:#64b5ff;width:0;transition:width .2s}h2{font-size:clamp(21px,4vw,26px);line-height:1.35;margin:0 0 25px}.option,button.action{display:block;width:100%;padding:18px;margin:11px 0;border:0;border-radius:14px;background:#2a416f;color:white;text-align:left;font-size:17px;cursor:pointer}.option:disabled{cursor:default;opacity:1}.option.correct{background:#146c53}.option.wrong{background:#8a3446}button.action{background:#3478f6;text-align:center;font-weight:700}button.secondary{background:#304369}.explain{padding:15px;border-radius:12px;background:#101d39;margin-top:18px;line-height:1.5}.hidden{display:none}small{color:#a6b7d8}a{color:#9dceff}</style></head><body><main><h1>🧠 Hjärnmatchen – IQ 110</h1><p>50 nya kluriga frågor • 4 svarsalternativ • 1 fråga i taget</p><section class="panel" id="game"><div class="top"><span id="progress"></span><span id="score"></span></div><div class="track"><div class="fill" id="fill"></div></div><h2 id="question"></h2><div id="answers"></div><div id="feedback" class="explain hidden" aria-live="polite"></div><button class="action hidden" id="next">Nästa fråga →</button></section><section class="panel hidden" id="end"><h2 id="result"></h2><p id="resultText"></p><button class="action" id="share">📤 Dela resultat</button><button class="action secondary" id="restart">🔁 Spela igen</button><a href="index.html">Till alla spel</a></section><p><small>Ett underhållningsquiz – inte ett standardiserat IQ-test.</small></p></main><script>const questions=[{"q": "Vilket ord betyder ungefär samma sak som ”ambivalent”?", "a": ["Likgiltig", "Kluven", "Envis", "Övertygad"], "correct": 1, "why": "Ambivalent innebär att ha motstridiga känslor eller inställningar."}, {"q": "Vilken stad ligger längst norrut?", "a": ["Oslo", "Stockholm", "Helsingfors", "Köpenhamn"], "correct": 2, "why": "Helsingfors ligger något längre norrut än Oslo och Stockholm."}, {"q": "Vilket grundämne har kemisk beteckning K?", "a": ["Kalcium", "Kalium", "Koppar", "Kisel"], "correct": 1, "why": "K är beteckningen för kalium."}, {"q": "Vad kallas läran om jordbävningar?", "a": ["Meteorologi", "Seismologi", "Geodesi", "Ekologi"], "correct": 1, "why": "Seismologi studerar jordbävningar och seismiska vågor."}, {"q": "Vilken av dessa författare skrev ”Frankenstein”?", "a": ["Jane Austen", "Mary Shelley", "Virginia Woolf", "Emily Brontë"], "correct": 1, "why": "Mary Shelley skrev romanen Frankenstein."}, {"q": "Om alla korpar är fåglar och vissa fåglar inte flyger, vad vet vi säkert?", "a": ["Vissa korpar flyger inte", "Alla fåglar är korpar", "Alla korpar är fåglar", "Inga korpar flyger"], "correct": 2, "why": "Det enda säkra är påståendet som redan givits."}, {"q": "Vilket land har flest tidszoner om även utomeuropeiska territorier räknas?", "a": ["Ryssland", "USA", "Frankrike", "Kina"], "correct": 2, "why": "Frankrike har många tidszoner genom sina utomeuropeiska territorier."}, {"q": "Vad mäts med en barometer?", "a": ["Luftfuktighet", "Lufttryck", "Vindhastighet", "Temperatur"], "correct": 1, "why": "En barometer mäter lufttryck."}, {"q": "Vilket av följande tal är ett primtal?", "a": ["51", "57", "61", "63"], "correct": 2, "why": "61 är endast delbart med 1 och 61."}, {"q": "Vilken planet har längst omloppstid runt solen av dessa?", "a": ["Mars", "Jupiter", "Saturnus", "Neptunus"], "correct": 3, "why": "Neptunus tar omkring 165 jordår på ett varv."}, {"q": "Vad är en palindrom?", "a": ["Ett ord utan vokaler", "Ett ord som läses lika åt båda håll", "Ett ord med två betydelser", "Ett låneord"], "correct": 1, "why": "Exempel: radar."}, {"q": "Vilket år föll Berlinmuren?", "a": ["1987", "1989", "1991", "1993"], "correct": 1, "why": "Berlinmuren öppnades i november 1989."}, {"q": "Vad är det främsta syftet med röda blodkroppar?", "a": ["Bekämpa bakterier", "Transportera syre", "Bildar hormoner", "Bryta ner fett"], "correct": 1, "why": "Hemoglobin i röda blodkroppar transporterar syre."}, {"q": "Vilket hav ligger mellan Afrika och Australien?", "a": ["Atlanten", "Norra ishavet", "Indiska oceanen", "Stilla havet"], "correct": 2, "why": "Indiska oceanen ligger mellan Afrika och Australien."}, {"q": "Vad kallas ett påstående som motsäger sig självt?", "a": ["Hypotes", "Paradox", "Axiom", "Metafor"], "correct": 1, "why": "En paradox kan innebära en skenbar eller verklig motsägelse."}, {"q": "Vilket instrument används för att mäta elektrisk resistans?", "a": ["Ohmmeter", "Amperemeter", "Hygrometer", "Spektrometer"], "correct": 0, "why": "Resistans mäts i ohm med en ohmmeter."}, {"q": "Vilken svensk kung dog vid Fredrikstens fästning 1718?", "a": ["Gustav II Adolf", "Karl XII", "Karl XI", "Gustav III"], "correct": 1, "why": "Karl XII dog under belägringen av Fredriksten."}, {"q": "Vad betyder prefixet ”anti-”?", "a": ["Före", "Mot", "Efter", "Tillsammans"], "correct": 1, "why": "Anti- betyder mot eller motsatt."}, {"q": "Vilken av dessa är INTE en av de fyra blodgrupperna i ABO-systemet?", "a": ["A", "B", "C", "AB"], "correct": 2, "why": "ABO-systemet består av A, B, AB och O."}, {"q": "Vilken bergskedja skiljer till stor del Europa från Asien enligt en vanlig geografisk gränsdragning?", "a": ["Anderna", "Alperna", "Uralbergen", "Atlasbergen"], "correct": 2, "why": "Uralbergen används ofta som del av gränsen mellan Europa och Asien."}, {"q": "Om en analog klocka visar 03:15, vilken vinkel är ungefär mellan visarna?", "a": ["0 grader", "7,5 grader", "30 grader", "90 grader"], "correct": 1, "why": "Timvisaren har rört sig en fjärdedel av vägen från 3 till 4."}, {"q": "Vilket språk tillhör INTE den germanska språkfamiljen?", "a": ["Nederländska", "Isländska", "Finska", "Tyska"], "correct": 2, "why": "Finska är ett uraliskt språk."}, {"q": "Vad är ett annat ord för ”lakonisk”?", "a": ["Kortfattad", "Högljudd", "Otydlig", "Detaljerad"], "correct": 0, "why": "Lakonisk betyder fåordig eller kortfattad."}, {"q": "Vilken del av hjärnan är särskilt viktig för balans och koordination?", "a": ["Lillhjärnan", "Hypofysen", "Hjärnbalken", "Hippocampus"], "correct": 0, "why": "Lillhjärnan har en central roll i koordination."}, {"q": "Vilken metall är flytande vid normal rumstemperatur?", "a": ["Tenn", "Kvicksilver", "Aluminium", "Bly"], "correct": 1, "why": "Kvicksilver är flytande vid vanlig rumstemperatur."}, {"q": "Vad kallas en triangel där alla sidor är olika långa?", "a": ["Likbent", "Likformig", "Oliksidig", "Rätvinklig"], "correct": 2, "why": "En oliksidig triangel har tre olika sidlängder."}, {"q": "Vilken historisk civilisation byggde Machu Picchu?", "a": ["Maya", "Inka", "Azteker", "Romare"], "correct": 1, "why": "Machu Picchu uppfördes av inkariket."}, {"q": "Vad betyder ”kronologi”?", "a": ["Läran om färger", "Tidsordning", "Studiet av språk", "Läran om kartor"], "correct": 1, "why": "Kronologi beskriver händelsers ordning i tiden."}, {"q": "Vilken av följande enheter mäter effekt?", "a": ["Joule", "Watt", "Newton", "Pascal"], "correct": 1, "why": "Watt är SI-enheten för effekt."}, {"q": "Vilket land gränsar INTE till Tyskland?", "a": ["Belgien", "Danmark", "Slovakien", "Polen"], "correct": 2, "why": "Slovakien har ingen landgräns mot Tyskland."}, {"q": "Vad är fotosyntesens viktigaste energikälla?", "a": ["Jordvärme", "Solljus", "Vind", "Syre"], "correct": 1, "why": "Växter använder ljusenergi vid fotosyntesen."}, {"q": "Vad kallas en dikt med 14 rader enligt en klassisk form?", "a": ["Haiku", "Sonett", "Epos", "Limerick"], "correct": 1, "why": "En sonett har normalt 14 versrader."}, {"q": "Vilket ämne har pH 7 vid 25 °C i idealiserat rent tillstånd?", "a": ["Rent vatten", "Citronsaft", "Ättika", "Ammoniaklösning"], "correct": 0, "why": "Rent vatten är neutralt vid 25 °C."}, {"q": "Vilken ö är störst till ytan?", "a": ["Island", "Irland", "Sicilien", "Kreta"], "correct": 0, "why": "Island är störst av alternativen."}, {"q": "Vilken av följande händelser inträffade först?", "a": ["Första månlandningen", "Första världskrigets början", "Berlinmurens fall", "Sovjetunionens upplösning"], "correct": 1, "why": "Första världskriget började 1914."}, {"q": "Vad innebär ”empirisk” kunskap?", "a": ["Grundad i observationer och erfarenhet", "Grundad enbart i tradition", "Grundad enbart i gissningar", "Alltid matematisk"], "correct": 0, "why": "Empirisk kunskap bygger på observationer eller erfarenhet."}, {"q": "Vilken gas utgör störst andel av jordens atmosfär?", "a": ["Syre", "Koldioxid", "Kväve", "Argon"], "correct": 2, "why": "Kväve utgör omkring 78 procent av luften."}, {"q": "Vad är motsatsen till ”explicit”?", "a": ["Implicit", "Tydlig", "Direkt", "Noggrann"], "correct": 0, "why": "Implicit betyder underförstådd, medan explicit är uttrycklig."}, {"q": "Vilken vetenskapsman förknippas med de tre rörelselagarna?", "a": ["Charles Darwin", "Isaac Newton", "Niels Bohr", "Louis Pasteur"], "correct": 1, "why": "Newtons rörelselagar är grundläggande inom klassisk mekanik."}, {"q": "Vilken svensk stad ligger vid mynningen av Göta älv?", "a": ["Uddevalla", "Göteborg", "Karlstad", "Trollhättan"], "correct": 1, "why": "Göta älv mynnar vid Göteborg."}, {"q": "Vilket av dessa djur är ett pungdjur?", "a": ["Utter", "Koala", "Mullvad", "Igelkott"], "correct": 1, "why": "Koalan är ett pungdjur."}, {"q": "Vad beskriver ordet ”anarki” i sin ursprungliga betydelse?", "a": ["Frånvaro av härskare", "Militärt styre", "Direkt demokrati", "Kungligt styre"], "correct": 0, "why": "Ordet kommer från grekiska och betyder ungefär utan härskare."}, {"q": "Vilket land var först med att ge kvinnor rösträtt i nationella val?", "a": ["Sverige", "Nya Zeeland", "Frankrike", "Schweiz"], "correct": 1, "why": "Nya Zeeland införde kvinnlig rösträtt i parlamentsval 1893."}, {"q": "Vad kallas kroppens förmåga att hålla en relativt stabil inre miljö?", "a": ["Osmos", "Homeostas", "Mutation", "Metabolism"], "correct": 1, "why": "Homeostas är reglering av den inre miljön."}, {"q": "Vilken av följande är en måne till Saturnus?", "a": ["Europa", "Titan", "Phobos", "Ganymedes"], "correct": 1, "why": "Titan är Saturnus största måne."}, {"q": "Vad är en allegori?", "a": ["En berättelse med symbolisk innebörd", "Ett rent rim", "En historisk tidslinje", "Ett musikaliskt tempo"], "correct": 0, "why": "En allegori förmedlar en djupare betydelse genom symboler."}, {"q": "Vilken av följande huvudstäder ligger vid floden Donau?", "a": ["Prag", "Budapest", "Warszawa", "Madrid"], "correct": 1, "why": "Donau rinner genom Budapest."}, {"q": "Om två påståenden inte kan vara sanna samtidigt, är de då...", "a": ["Identiska", "Oförenliga", "Synonyma", "Oberoende"], "correct": 1, "why": "Oförenliga påståenden kan inte båda vara sanna."}, {"q": "Vilken vitamin kan huden bilda med hjälp av solljus?", "a": ["Vitamin A", "Vitamin B12", "Vitamin C", "Vitamin D"], "correct": 3, "why": "UVB-strålning hjälper huden att bilda vitamin D."}, {"q": "Vilket av dessa fenomen beror främst på ljusets brytning och reflektion i vattendroppar?", "a": ["Regnbåge", "Åska", "Norrsken", "Tidvatten"], "correct": 0, "why": "Regnbågen uppstår när ljus bryts, reflekteras och sprids i droppar."}];let index=0,points=0,answered=false;const $=id=>document.getElementById(id);function render(){answered=false;const item=questions[index];$('progress').textContent='Fråga '+(index+1)+' av '+questions.length;$('score').textContent=points+' rätt';$('fill').style.width=(index/questions.length*100)+'%';$('question').textContent=item.q;$('answers').replaceChildren();$('feedback').classList.add('hidden');$('next').classList.add('hidden');item.a.forEach((answer,i)=>{const b=document.createElement('button');b.className='option';b.textContent=String.fromCharCode(65+i)+'. '+answer;b.addEventListener('click',()=>choose(i));$('answers').appendChild(b)})}function choose(i){if(answered)return;answered=true;const item=questions[index];if(i===item.correct)points++;Array.from($('answers').children).forEach((b,n)=>{b.disabled=true;if(n===item.correct)b.classList.add('correct');else if(n===i)b.classList.add('wrong')});$('score').textContent=points+' rätt';$('feedback').textContent=(i===item.correct?'✅ Rätt! ':'❌ Inte riktigt. ')+item.why;$('feedback').classList.remove('hidden');$('next').classList.remove('hidden');$('next').textContent=index===questions.length-1?'Visa mitt resultat →':'Nästa fråga →'}$('next').addEventListener('click',()=>{index++;if(index<questions.length)render();else finish()});function finish(){$('game').classList.add('hidden');$('end').classList.remove('hidden');$('result').textContent='🏆 Du fick '+points+' av '+questions.length+' rätt!';$('resultText').textContent=points>=45?'Fantastiskt resultat!':points>=35?'Mycket starkt jobbat!':points>=25?'Bra kämpat!':'Du har lärt dig en hel del – försök igen!'}$('restart').addEventListener('click',()=>{index=0;points=0;$('end').classList.add('hidden');$('game').classList.remove('hidden');render()});$('share').addEventListener('click',async()=>{const msg='🧠 Jag fick '+points+'/50 rätt i Hjärnmatchen – IQ 110! Vågar du utmana mig? '+location.href.split('?')[0];if(navigator.share){try{await navigator.share({text:msg});return}catch(e){}}if(navigator.clipboard){try{await navigator.clipboard.writeText(msg);alert('Resultatet kopierat!');return}catch(e){}}prompt('Kopiera och dela:',msg)});render();</script></body></html>

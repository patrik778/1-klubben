<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Medicin, kropp, hälsa & träning | 1%-klubben</title><style>*{box-sizing:border-box}body{margin:0;background:#0d1426;color:#f8fafc;font-family:system-ui,Arial,sans-serif;min-height:100vh;display:grid;place-items:center;padding:18px}main{width:min(100%,720px);background:#1b283d;border:1px solid #34445d;border-radius:24px;padding:clamp(20px,5vw,38px)}.top,.meta{display:flex;justify-content:space-between;gap:10px;align-items:center}.pill{background:#31425e;padding:9px 13px;border-radius:30px;font-size:14px}h1{font-size:clamp(26px,5vw,39px);margin:18px 0 8px}p{color:#cbd5e1;line-height:1.55}.track{height:10px;background:#34445d;border-radius:99px;margin:25px 0;overflow:hidden}.fill{height:100%;background:#4ade80;width:0;transition:width .2s}.meta{color:#cbd5e1;margin-bottom:20px}h2{font-size:clamp(21px,4vw,28px);line-height:1.35}button{font:inherit;cursor:pointer}.choice{display:block;width:100%;padding:16px;margin:11px 0;border:1px solid #415574;background:#293b55;color:white;text-align:left;border-radius:13px;line-height:1.4}.choice:disabled{cursor:default;opacity:.8}.choice.correct{background:#14532d;border-color:#4ade80;opacity:1}.choice.wrong{background:#7f1d1d;border-color:#fca5a5;opacity:1}.feedback{background:#111d30;border-left:4px solid #4ade80;padding:15px;border-radius:8px;margin-top:18px;line-height:1.6}.next{background:#2563eb;color:white;border:0;border-radius:12px;padding:15px 20px;margin-top:18px;font-weight:700;width:100%}.hide{display:none}.result{text-align:center;font-size:55px;font-weight:800;margin:20px 0}footer{text-align:center;color:#94a3b8;font-size:13px;margin-top:26px}a{color:#bfdbfe}</style></head><body><main><div class="top"><span class="pill">🏆 1%-klubben</span><span class="pill" id="counter">Fråga 1 av 15</span></div><h1>🩺 Medicin, kropp, hälsa & träning</h1><p>Medelsvår+ · 15 utmanande frågor om hur kroppen fungerar, tränar och återhämtar sig.</p><div class="track"><div class="fill" id="fill"></div></div><div class="meta"><span id="category">Fysiologi</span><strong id="score">Poäng: 0</strong></div><section id="game"><h2 id="question"></h2><div id="choices"></div><div class="feedback hide" id="feedback" aria-live="polite"></div><button class="next hide" id="next">Nästa fråga →</button></section><section id="end" class="hide"><h2>🏁 Slutresultat</h2><div class="result" id="result"></div><p id="rating"></p><button class="next" id="restart">Spela igen</button><button class="next" id="share">Dela mitt resultat</button></section><footer>Fristående kunskapsquiz i 1%-klubben · Allmän kunskap, inte individuell medicinsk rådgivning.</footer></main><script>
const questions=[
{category:'Kondition',question:'Vad beskriver VO₂max främst?',options:['Den högsta syreupptagningsförmågan vid intensiv ansträngning','Den maximala mängden luft som ryms i lungorna','Den högsta pulsen man kan uppnå under ett dygn','Andelen syre som finns i blodet i vila'],correct:0,explanation:'VO₂max anger kroppens maximala syreupptag per tidsenhet, ofta uttryckt i ml/kg/min.'},
{category:'Muskelfysiologi',question:'Vilken förändring bidrar mest direkt till att en muskel blir större efter långvarig styrketräning?',options:['Fler skelettmuskelfibrer bildas i stor mängd','Befintliga muskelfibrers tvärsnittsarea ökar','Senor omvandlas till muskelvävnad','Musklernas fettlager blir tjockare'],correct:1,explanation:'Muskelhypertrofi innebär framför allt att befintliga muskelfibrer ökar i storlek.'},
{category:'Blodtryck',question:'Vad representerar det diastoliska blodtrycket?',options:['Trycket när hjärtats kamrar drar ihop sig','Trycket i venerna när man står upp','Trycket i artärerna när hjärtat slappnar av mellan slagen','Skillnaden mellan blodtrycket i höger och vänster arm'],correct:2,explanation:'Det diastoliska värdet mäter artärtrycket under hjärtats avslappningsfas.'},
{category:'Energiomsättning',question:'Vilket energisystem dominerar vid en maximal sprint som varar ungefär fem sekunder?',options:['Aerob fettförbränning','ATP–kreatinfosfatsystemet','Enbart aerob kolhydratförbränning','Nedbrytning av muskelprotein'],correct:1,explanation:'ATP–kreatinfosfatsystemet levererar energi mycket snabbt under de första sekunderna av maximal ansträngning.'},
{category:'Återhämtning',question:'Vilket påstående om träningsvärk (DOMS) stämmer bäst?',options:['Den orsakas främst av mjölksyra som ligger kvar i muskeln i flera dygn','Den innebär alltid att muskeln har skadats allvarligt','Den kan uppstå efter ovana belastningar, särskilt excentriskt arbete','Den visar exakt hur mycket muskeltillväxt träningen gav'],correct:2,explanation:'Fördröjd träningsvärk är vanlig efter ovan eller excentrisk belastning och är inte ett exakt mått på träningseffekt.'},
{category:'Hjärta',question:'Vad menas med hjärtats slagvolym?',options:['Blodmängden som pumpas ut från en kammare per hjärtslag','Antalet hjärtslag per minut','Den totala blodvolymen i kroppen','Blodmängden som passerar njurarna per minut'],correct:0,explanation:'Slagvolymen är den mängd blod en hjärtkammare pumpar ut vid varje slag.'},
{category:'Hormoner',question:'Vilket hormon hjälper normalt kroppens celler att ta upp glukos och sänker blodsockret?',options:['Kortisol','Adrenalin','Glukagon','Insulin'],correct:3,explanation:'Insulin stimulerar bland annat glukosupptag i muskel- och fettvävnad och minskar blodsockret.'},
{category:'Träningslära',question:'Vad innebär progressiv överbelastning inom styrketräning?',options:['Att alltid träna till total utmattning','Att gradvis öka träningskravet när kroppen anpassar sig','Att byta träningsprogram efter varje pass','Att minska vilan oavsett om tekniken försämras'],correct:1,explanation:'Progressiv överbelastning är en planerad ökning av belastning, volym eller annan träningsutmaning över tid.'},
{category:'Njurfysiologi',question:'Vilken funktion har njurarnas nefron?',options:['Att bilda röda blodkroppar direkt','Att transportera syre från lungorna','Att filtrera blod och bidra till reglering av vätska och salter','Att lagra galla för fettspjälkning'],correct:2,explanation:'Nefronen är njurarnas funktionella enheter och sköter filtrering och finjustering av urinens innehåll.'},
{category:'Konditionsträning',question:'Vad är laktattröskel i träningssammanhang?',options:['En belastningsnivå där blodlaktat börjar öka tydligare i förhållande till arbetsintensiteten','Den puls där hjärtat slutar använda syre','Den tidpunkt då allt muskelglykogen är slut','En gräns där kroppen helt upphör att förbränna fett'],correct:0,explanation:'Laktattröskeln beskriver ett intensitetsområde där laktatkoncentrationen börjar stiga mer påtagligt; exakta definitioner varierar.'},
{category:'Skelett & träning',question:'Vilken typ av aktivitet ger typiskt en tydlig mekanisk stimulans till skelettets benmassa?',options:['Enbart avslappningsövningar','Långvarigt stillasittande','Belastande styrketräning och hopp där det är lämpligt','Endast långsam andning'],correct:2,explanation:'Skelettet anpassar sig till mekanisk belastning, bland annat vid styrketräning och stötbelastning.'},
{category:'Sömn',question:'Vilken sömnfas är särskilt förknippad med livliga drömmar och snabb ögonrörelse?',options:['REM-sömn','N3-djupsömn','Vaken vila','N1-insomning enbart'],correct:0,explanation:'REM står för rapid eye movement och är en sömnfas med hög hjärnaktivitet och ofta livliga drömmar.'},
{category:'Näringslära',question:'Var lagrar kroppen en betydande del av sina lättillgängliga kolhydratreserver för fysisk aktivitet?',options:['Som glykogen i muskler och lever','Som glukos i skelettets benmärg','Som fria kolhydrater i lungblåsorna','Som stärkelse i njurarna'],correct:0,explanation:'Kolhydrater lagras främst som glykogen i skelettmuskulatur och lever.'},
{category:'Immunförsvar',question:'Vilka celler kan utvecklas till plasmaceller som producerar antikroppar?',options:['Röda blodkroppar','B-lymfocyter','Blodplättar','Skelettmuskelceller'],correct:1,explanation:'Aktiverade B-lymfocyter kan differentiera till plasmaceller som producerar antikroppar.'},
{category:'Hälsa & kondition',question:'Varför kan en vältränad uthållighetsidrottare ha lägre vilopuls än en otränad person?',options:['Hjärtat kan ofta pumpa mer blod per slag','Blodet innehåller inga röda blodkroppar','Kroppen behöver inte längre syre i vila','Hjärtat hoppar regelbundet över vartannat slag'],correct:0,explanation:'Uthållighetsträning kan öka slagvolymen och påverka autonom reglering, så färre slag kan räcka för samma minutvolym i vila.'}
];
let i=0,points=0,locked=false;const el=id=>document.getElementById(id);function render(){locked=false;const q=questions[i];el('counter').textContent='Fråga '+(i+1)+' av '+questions.length;el('category').textContent=q.category;el('score').textContent='Poäng: '+points;el('fill').style.width=(i/questions.length*100)+'%';el('question').textContent=q.question;el('choices').replaceChildren();el('feedback').classList.add('hide');el('next').classList.add('hide');q.options.forEach((o,j)=>{const b=document.createElement('button');b.className='choice';b.textContent='ABCD'[j]+'. '+o;b.onclick=()=>answer(j);el('choices').appendChild(b)})}function answer(j){if(locked)return;locked=true;const q=questions[i];if(j===q.correct)points++;Array.from(el('choices').children).forEach((b,k)=>{b.disabled=true;if(k===q.correct)b.classList.add('correct');else if(k===j)b.classList.add('wrong')});el('score').textContent='Poäng: '+points;el('feedback').textContent=(j===q.correct?'✅ Rätt! ':'❌ Inte riktigt. Rätt svar: '+'ABCD'[q.correct]+'. '+q.options[q.correct]+'. ')+q.explanation;el('feedback').classList.remove('hide');el('next').textContent=i===questions.length-1?'Visa slutresultat →':'Nästa fråga →';el('next').classList.remove('hide')}el('next').onclick=()=>{i++;if(i<questions.length)render();else finish()};function finish(){el('game').classList.add('hide');el('end').classList.remove('hide');el('counter').textContent='Klart!';el('fill').style.width='100%';el('result').textContent=points+' / '+questions.length;el('rating').textContent=points>=13?'🏆 Expert på kropp och träning!':points>=10?'🌟 Mycket goda kunskaper!':points>=7?'👏 Bra jobbat!':'📚 Du har lärt dig något nytt!'}el('restart').onclick=()=>{i=0;points=0;el('end').classList.add('hide');el('game').classList.remove('hide');render()};el('share').onclick=async()=>{const text='Jag fick '+points+' av 15 rätt i Medicin, kropp, hälsa & träning i 1%-klubben! '+location.href;if(navigator.share){try{await navigator.share({title:'Medicin, kropp, hälsa & träning',text})}catch(e){}}else if(navigator.clipboard){try{await navigator.clipboard.writeText(text);alert('Resultatet kopierat!')}catch(e){prompt('Kopiera resultatet:',text)}}else prompt('Kopiera resultatet:',text)};render();
</script></body></html>

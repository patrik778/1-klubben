<!doctype html><html lang="sv"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Hjärnmatchen – IQ 100</title><style>*{box-sizing:border-box}body{margin:0;background:#0c1530;color:#fff;font:17px system-ui,Arial,sans-serif}main{max-width:640px;margin:25px auto;padding:20px}h1{font-size:30px;margin:0 0 8px}.sub{color:#b9c8e8}.panel{background:#172548;border:1px solid #34456c;border-radius:20px;padding:24px;margin-top:20px}.meta{color:#b9c8e8;font-size:14px;margin-bottom:15px}.question{font-size:23px;font-weight:750;line-height:1.35;margin:15px 0 22px}.answers{display:grid;gap:12px}button{font:inherit;cursor:pointer;border:0;border-radius:12px;padding:15px;text-align:left;background:#273c69;color:white}button:hover{background:#35518a}button:disabled{cursor:default;opacity:.8}.correct{background:#126b4b!important}.wrong{background:#873844!important}.primary{background:#7356e8;text-align:center;font-weight:700;margin-top:20px;width:100%}.feedback{margin-top:18px;line-height:1.5}.hidden{display:none}.progress{height:9px;background:#293c63;border-radius:20px;overflow:hidden;margin-top:15px}.progress span{display:block;height:100%;background:#8c77fa;transition:width .2s}.foot{font-size:13px;color:#aebdd8;margin-top:22px}a{color:#bcb0ff}</style></head><body><main><h1>🧠 Hjärnmatchen – IQ 100</h1><div class="sub">20 frågor om allt möjligt • 4 alternativ • 1 fråga i taget</div><div class="panel"><div id="game"><div class="meta" id="meta"></div><div class="progress"><span id="bar"></span></div><div class="question" id="question"></div><div class="answers" id="answers"></div><div class="feedback hidden" id="feedback"></div><button class="primary hidden" id="next">Nästa fråga →</button></div><div id="finish" class="hidden"><h2 id="result"></h2><p id="summary"></p><button class="primary" id="share">Dela resultat</button><button class="primary" id="restart">Spela igen</button></div></div><div class="foot">Ett underhållningsquiz – inte ett standardiserat IQ-test.</div></main><script>
const questions=[
{q:'Vilket ord passar bäst i följden: frö, planta, träd, …?',a:['Blad','Skog','Jord','Rot'],c:1,e:'Flera träd kan bilda en skog.'},
{q:'Vilket land har huvudstaden Ljubljana?',a:['Slovakien','Slovenien','Kroatien','Serbien'],c:1,e:'Ljubljana är Sloveniens huvudstad.'},
{q:'Vilken av dessa är INTE en planet i vårt solsystem?',a:['Neptunus','Venus','Pluto','Mars'],c:2,e:'Pluto klassas som en dvärgplanet.'},
{q:'Om alla ekar är träd och vissa träd tappar löven, vad kan man säkert säga?',a:['Alla ekar tappar löven','Inga ekar tappar löven','Alla ekar är träd','Alla träd är ekar'],c:2,e:'Det enda som uttryckligen följer är att alla ekar är träd.'},
{q:'Vilket ämne har den kemiska beteckningen Fe?',a:['Fluor','Järn','Fosfor','Silver'],c:1,e:'Fe kommer från latinets ferrum.'},
{q:'Vad kallas läran om jordbävningar?',a:['Meteorologi','Seismologi','Ekologi','Astronomi'],c:1,e:'Seismologi handlar om jordbävningar och seismiska vågor.'},
{q:'Vilket av följande ord är en palindrom?',a:['Radar','Kamera','Cykel','Spegel'],c:0,e:'Radar läses likadant framifrån och bakifrån.'},
{q:'Vilket hav ligger mellan Afrika och Australien?',a:['Atlanten','Norra ishavet','Indiska oceanen','Stilla havet'],c:2,e:'Indiska oceanen ligger mellan bland annat Afrika och Australien.'},
{q:'Vilken av dessa uppfinningar kom först?',a:['Telefonen','Tryckpress med lösa typer i Europa','Radion','Flygplanet'],c:1,e:'Gutenbergs tryckteknik utvecklades på 1400-talet.'},
{q:'Vad är den viktigaste funktionen hos röda blodkroppar?',a:['Bekämpa bakterier','Transportera syre','Bildar hormoner','Bryta ner fett'],c:1,e:'Hemoglobinet i röda blodkroppar transporterar syre.'},
{q:'Vilken form har sex sidor?',a:['Pentagon','Hexagon','Heptagon','Oktagon'],c:1,e:'Hexa betyder sex.'},
{q:'Vilket av följande djur är ett däggdjur?',a:['Pingvin','Delfin','Krokodil','Haj'],c:1,e:'Delfiner andas luft och diar sina ungar.'},
{q:'Vad betyder uttrycket ”att slå två flugor i en smäll”?',a:['Att göra två misstag','Att lösa två saker med en handling','Att skynda för mycket','Att ta en onödig risk'],c:1,e:'En handling ger två önskade resultat.'},
{q:'Vilken stad är känd för kanaler och gondoler?',a:['Florens','Venedig','Prag','Wien'],c:1,e:'Venedig ligger på öar och har ett stort nät av kanaler.'},
{q:'Vilken gas tar växter upp vid fotosyntesen?',a:['Syre','Kväve','Koldioxid','Helium'],c:2,e:'Växter använder koldioxid och vatten för att bilda socker med hjälp av ljus.'},
{q:'Vilken av dessa författare skrev ”Gösta Berlings saga”?',a:['Astrid Lindgren','Selma Lagerlöf','August Strindberg','Vilhelm Moberg'],c:1,e:'Romanen var Selma Lagerlöfs debut 1891.'},
{q:'Om du går norrut, svänger höger och sedan höger igen, åt vilket håll går du?',a:['Norr','Söder','Öster','Väster'],c:1,e:'Två högersvängar ger motsatt riktning.'},
{q:'Vilken del av örat hjälper särskilt till med balansen?',a:['Trumhinnan','Balansorganet i innerörat','Örsnibben','Hörselgången'],c:1,e:'Balansorganet i innerörat registrerar huvudets rörelser och läge.'},
{q:'Vilket av dessa tal är ett primtal?',a:['21','27','29','33'],c:2,e:'29 är endast delbart med 1 och 29.'},
{q:'Vad har en kompassnål som pekar mot norr främst att göra med?',a:['Jordens magnetfält','Månens gravitation','Solens ljus','Vindens riktning'],c:0,e:'Kompassnålen ställer in sig efter jordens magnetfält.'}
];
let index=0,score=0,answered=false;const $=id=>document.getElementById(id);
function render(){answered=false;$('feedback').classList.add('hidden');$('next').classList.add('hidden');$('meta').textContent=`Fråga ${index+1} av ${questions.length}  •  ${score} rätt`;$('bar').style.width=`${index/questions.length*100}%`;$('question').textContent=questions[index].q;$('answers').innerHTML='';questions[index].a.forEach((answer,i)=>{const b=document.createElement('button');b.textContent=`${'ABCD'[i]}. ${answer}`;b.addEventListener('click',()=>choose(i));$('answers').appendChild(b)})}
function choose(choice){if(answered)return;answered=true;const item=questions[index];if(choice===item.c)score++;[...$('answers').children].forEach((b,i)=>{b.disabled=true;if(i===item.c)b.classList.add('correct');else if(i===choice)b.classList.add('wrong')});$('feedback').textContent=`${choice===item.c?'✅ Rätt!':'❌ Inte riktigt.'} ${item.e}`;$('feedback').classList.remove('hidden');$('next').textContent=index===questions.length-1?'Visa resultat →':'Nästa fråga →';$('next').classList.remove('hidden')}
$('next').addEventListener('click',()=>{index++;if(index<questions.length){render();return}$('game').classList.add('hidden');$('finish').classList.remove('hidden');$('result').textContent=`Du fick ${score} av ${questions.length} rätt!`;$('summary').textContent=score>=17?'Imponerande! Du har stenkoll.':score>=12?'Bra jobbat! Du kan mycket om allt möjligt.':score>=7?'Stabilt! Utmana en vän och försök igen.':'Här finns chans till revansch!';});
$('restart').addEventListener('click',()=>{index=0;score=0;$('finish').classList.add('hidden');$('game').classList.remove('hidden');render()});
$('share').addEventListener('click',async()=>{const text=`Jag fick ${score}/20 i 🧠 Hjärnmatchen – IQ 100! Kan du slå mig? ${location.href}`;try{if(navigator.share){await navigator.share({title:'Hjärnmatchen – IQ 100',text})}else if(navigator.clipboard){await navigator.clipboard.writeText(text);alert('Resultatet och länken är kopierade!')}else{prompt('Kopiera resultatet:',text)}}catch(e){if(e.name!=='AbortError')prompt('Kopiera resultatet:',text)}});render();
</script></body></html>
